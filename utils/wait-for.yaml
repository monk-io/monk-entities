namespace: utils

# Holds back the runnables that depend on it until an action succeeds. The
# instance does the waiting in ArrowScript, with wait-for, which calls the
# action every `delay` seconds, at most `max-attempts` times:
#
#   url-ready:
#     defines: utils/wait-for-action
#     ready: <- true wait-for(5, 24, "my-app/project/get-production-urls")
#
# The run fails when the action never succeeds. Keep `true` before wait-for:
# a wait-for that gives up leaves an error, which has to be the last value.
wait-for-action:
  defines: entity
  schema:
    ready:
      type: boolean
  checks:
    readiness:
      code: |
        function main(def) {
          if (def.ready !== true) {
            throw new Error("the action has not succeeded");
          }
        }
