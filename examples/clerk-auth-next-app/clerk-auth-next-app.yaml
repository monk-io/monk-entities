# Clerk Auth Next.js App
# Next.js application with Clerk authentication — sign-in, sign-up, and protected pages.
# Includes an OAuth application for third-party auth flows.
# Flow: User -> Next.js app -> Clerk API (auth) -> Protected content

namespace: clerk-auth-next-app

# === Clerk Credentials ===

# Validates the Clerk API key and exposes publishable key + secret ref for the app
clerk-creds:
  defines: clerk/credentials
  secret_ref: clerk-secret-key
  publishable_key: <- secret("clerk-publishable-key")
  permitted-secrets:
    clerk-secret-key: true
    clerk-publishable-key: true
  services:
    data:
      protocol: custom

# === Clerk OAuth Application ===

# Creates an OAuth application for third-party integrations to authenticate via Clerk
clerk-oauth:
  defines: clerk/o-auth-application
  secret_ref: clerk-secret-key
  name: nextjs-app-oauth
  callback_url: http://localhost:3000/api/oauth/callback
  client_secret_ref: clerk-oauth-client-secret
  permitted-secrets:
    clerk-secret-key: true
    clerk-oauth-client-secret: true
  services:
    data:
      protocol: custom

# === Next.js Application ===

# Next.js app with Clerk authentication and OAuth client credentials
nextjs-app:
  defines: runnable
  permitted-secrets:
    clerk-secret-key: true
    clerk-oauth-client-secret: true
  connections:
    clerk:
      runnable: clerk-auth-next-app/clerk-creds
      service: data
    oauth:
      runnable: clerk-auth-next-app/clerk-oauth
      service: data
  depends:
    wait-for:
      runnables:
        - clerk-auth-next-app/clerk-creds
        - clerk-auth-next-app/clerk-oauth
      timeout: 120
  variables:
    # Clerk publishable key for client-side SDK
    clerk_secret_ref:
      value: <- connection-target("clerk") entity get-member("secret_ref")
      type: string
    next_public_clerk_publishable_key:
      env: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
      value: <- connection-target("clerk") entity-state get-member("publishable_key")
      type: string
    # Clerk secret key for server-side operations
    clerk_secret_key:
      env: CLERK_SECRET_KEY
      value: <- secret($clerk_secret_ref)
      type: string
    # OAuth application credentials wired from entity state
    oauth_secret_ref:
      value: <- connection-target("oauth") entity-state get-member("client_secret_secret")
      type: string
    clerk_oauth_client_id:
      env: CLERK_OAUTH_CLIENT_ID
      value: <- connection-target("oauth") entity-state get-member("client_id")
      type: string
    clerk_oauth_client_secret:
      env: CLERK_OAUTH_CLIENT_SECRET
      value: <- secret($oauth_secret_ref)
      type: string
    # Sign-in/up routing
    next_public_clerk_sign_in_url:
      env: NEXT_PUBLIC_CLERK_SIGN_IN_URL
      value: "/sign-in"
      type: string
    next_public_clerk_sign_up_url:
      env: NEXT_PUBLIC_CLERK_SIGN_UP_URL
      value: "/sign-up"
      type: string
    next_public_clerk_sign_in_fallback_redirect_url:
      env: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
      value: "/protected"
      type: string
    next_public_clerk_sign_up_fallback_redirect_url:
      env: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
      value: "/protected"
      type: string
    node_env:
      env: NODE_ENV
      value: "production"
      type: string
    port:
      env: PORT
      value: "3000"
      type: string
  containers:
    app:
      image: monkimages.azurecr.io/clerk-auth-next-app:latest
      ports:
        - "3000:3000"

# === Deploy Everything ===

# Deploy: monk load dist/clerk/MANIFEST && monk load examples/clerk-auth-next-app/clerk-auth-next-app.yaml && monk run -t TAG clerk-auth-next-app/stack
stack:
  defines: group
  members:
    - clerk-auth-next-app/clerk-creds
    - clerk-auth-next-app/clerk-oauth
    - clerk-auth-next-app/nextjs-app
