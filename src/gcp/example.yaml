# GCP Entities Example Stack
#
# This example demonstrates how to use GCP entities together
# to provision a complete infrastructure stack.

namespace: gcp-example

# =============================================================================
# Step 1: Enable Required APIs
# =============================================================================
# This should run first to ensure all required GCP APIs are enabled.

enable-apis:
  defines: gcp/service-usage
  apis:
    - sqladmin.googleapis.com
    - bigquery.googleapis.com
    - storage.googleapis.com
    - iam.googleapis.com
    - redis.googleapis.com
    - dns.googleapis.com
    - artifactregistry.googleapis.com
    - cloudtasks.googleapis.com

# =============================================================================
# Step 2: Create Service Account (optional)
# =============================================================================
# Create a service account for your application with necessary permissions.

app-service-account:
  defines: gcp/service-account
  name: my-app-sa
  display_name: My Application Service Account
  description: Service account for my application
  roles:
    - roles/cloudsql.client
    - roles/storage.objectViewer
    - roles/bigquery.dataViewer
  depends:
    wait-for:
      runnables:
        - gcp-example/enable-apis
      timeout: 300

app-service-account-key:
  defines: gcp/service-account-key
  secret: app-sa-credentials
  service_account_id: <- connection-target("service-account") entity-state get-member("unique_id")
  permitted-secrets:
    app-sa-credentials: true
  connections:
    service-account:
      runnable: gcp-example/app-service-account
      service: service-account
  depends:
    wait-for:
      runnables:
        - gcp-example/app-service-account
      timeout: 60

# =============================================================================
# Step 3: Create Cloud SQL Instance
# =============================================================================
# PostgreSQL instance for application data.

postgres-instance:
  defines: gcp/cloud-sql-instance
  name: my-app-postgres
  database_version: POSTGRES_14
  tier: db-f1-micro
  region: us-central1
  allow_all: true  # For development only - restrict in production!
  storage_size_gb: 10
  services:
    instance:
      protocol: tcp
      address: <- entity-state get-member("address") default("")
      port: <- entity-state get-member("port") default(5432) to-int
  depends:
    wait-for:
      runnables:
        - gcp-example/enable-apis
      timeout: 300

# =============================================================================
# Step 4: Create Database and User
# =============================================================================
# These depend on the instance being ready.

app-database:
  defines: gcp/cloud-sql-database
  instance: <- connection-target("instance") entity get-member("name")
  name: myapp_production
  services:
    db:
      protocol: custom
  connections:
    instance:
      runnable: gcp-example/postgres-instance
      service: instance
  depends:
    wait-for:
      runnables:
        - gcp-example/postgres-instance
      timeout: 600

app-db-user:
  defines: gcp/cloud-sql-user
  instance: <- connection-target("instance") entity get-member("name")
  name: app_user
  password_secret: app-db-password
  permitted-secrets:
    app-db-password: true
  services:
    user:
      protocol: custom
  connections:
    instance:
      runnable: gcp-example/postgres-instance
      service: instance
  depends:
    wait-for:
      runnables:
        - gcp-example/postgres-instance
      timeout: 600

# =============================================================================
# Step 5: Create BigQuery Dataset
# =============================================================================
# For analytics and data warehousing.

analytics-dataset:
  defines: gcp/big-query
  dataset: app_analytics
  location: US
  description: Analytics data for my application
  labels:
    environment: production
    team: data
  depends:
    wait-for:
      runnables:
        - gcp-example/enable-apis
      timeout: 300

# =============================================================================
# Step 6: Create Cloud Storage Bucket
# =============================================================================
# For file storage and backups.

app-bucket:
  defines: gcp/cloud-storage
  name: my-app-storage-bucket-unique-name  # Must be globally unique!
  location: US
  storage_class: STANDARD
  uniform_bucket_level_access: true
  versioning_enabled: true
  labels:
    environment: production
    purpose: app-storage
  depends:
    wait-for:
      runnables:
        - gcp-example/enable-apis
      timeout: 300

# =============================================================================
# Step 7: Create Memorystore for Redis
# =============================================================================
# Managed Redis cache with export/import snapshot support.

redis-cache:
  defines: gcp/memorystore-redis
  name: my-app-cache
  region: us-central1
  tier: BASIC
  memory_size_gb: 1
  redis_version: REDIS_7_0
  auth_enabled: true
  persistence_config:
    persistence_mode: RDB
    rdb_snapshot_period: SIX_HOURS
  depends:
    wait-for:
      runnables:
        - gcp-example/enable-apis
      timeout: 300

# =============================================================================
# Step 7: Create Cloud Storage HMAC Keys (S3-compatible)
# =============================================================================
# Provides HMAC credentials for S3-compatible clients.

storage-hmac-keys:
  defines: gcp/cloud-storage-hmac-keys
  service_account_email: <- connection-target("service-account") entity-state get-member("email")
  access_key_secret_ref: gcs-hmac-access-key
  secret_key_secret_ref: gcs-hmac-secret-key
  permitted-secrets:
    gcs-hmac-access-key: true
    gcs-hmac-secret-key: true
  connections:
    service-account:
      runnable: gcp-example/app-service-account
      service: service-account
  depends:
    wait-for:
      runnables:
        - gcp-example/app-service-account
      timeout: 60

# =============================================================================
# Step 8: Create Pub/Sub Topic and Subscription
# =============================================================================
# Asynchronous messaging between microservices.

notifications-topic:
  defines: gcp/pubsub-topic
  name: app-notifications
  labels:
    environment: production
    team: backend
  message_retention_duration: "604800s"  # 7 days
  services:
    data:
      protocol: custom
  depends:
    wait-for:
      runnables:
        - gcp-example/enable-apis
      timeout: 300

notifications-subscription:
  defines: gcp/pubsub-subscription
  name: notifications-worker
  topic_name: <- connection-target("topic") entity-state get-member("topic_name")
  ack_deadline_seconds: 60
  message_retention_duration: "604800s"
  min_retry_delay: "10s"
  max_retry_delay: "600s"
  labels:
    environment: production
    team: backend
  connections:
    topic:
      runnable: gcp-example/notifications-topic
      service: data
  depends:
    wait-for:
      runnables:
        - gcp-example/notifications-topic
      timeout: 120

# =============================================================================
# Step 9: Deploy Cloud Run Service
# =============================================================================
# Serverless container deployment with auto-scaling.

hello-service:
  defines: gcp/cloud-run-service
  name: hello-service
  location: us-central1
  image: us-docker.pkg.dev/cloudrun/container/hello
  port: 8080
  cpu: "1"
  memory: 512Mi
  min_instances: 0
  max_instances: 10
  concurrency: 80
  allow_unauthenticated: true
  labels:
    environment: production
    team: backend
  services:
    data:
      protocol: custom
  depends:
    wait-for:
      runnables:
        - gcp-example/enable-apis
      timeout: 300

# =============================================================================
# Step 10: Create Cloud Run Job
# =============================================================================
# Batch container execution for data processing tasks.

data-processor:
  defines: gcp/cloud-run-job
  name: data-processor
  location: us-central1
  image: us-docker.pkg.dev/cloudrun/container/job
  cpu: "2"
  memory: 1Gi
  task_count: 5
  parallelism: 3
  timeout_seconds: 600
  max_retries: 2
  labels:
    environment: production
    team: data
  depends:
    wait-for:
      runnables:
        - gcp-example/enable-apis
      timeout: 300

# =============================================================================
# Step 11: Create Cloud DNS Zone and Records
# =============================================================================
# DNS hosting for your domain.

app-dns-zone:
  defines: gcp/cloud-dns-zone
  name: app-example-zone
  dns_name: "app.example.com."
  zone_description: "DNS zone for the application"
  visibility: public
  labels:
    environment: production
    team: platform
  services:
    data:
      protocol: custom
  depends:
    wait-for:
      runnables:
        - gcp-example/enable-apis
      timeout: 300

app-dns-record-a:
  defines: gcp/cloud-dns-record-set
  zone_name: app-example-zone
  record_name: "www.app.example.com."
  record_type: A
  ttl: 300
  rrdatas:
    - "203.0.113.10"
  depends:
    wait-for:
      runnables:
        - gcp-example/app-dns-zone
      timeout: 120

app-dns-record-cname:
  defines: gcp/cloud-dns-record-set
  zone_name: app-example-zone
  record_name: "api.app.example.com."
  record_type: CNAME
  ttl: 300
  rrdatas:
    - "www.app.example.com."
  depends:
    wait-for:
      runnables:
        - gcp-example/app-dns-zone
      timeout: 120

# =============================================================================
# Step 12: Create Artifact Registry Repository
# =============================================================================
# Docker container registry for application images.

docker-repo:
  defines: gcp/artifact-registry-repository
  name: my-app-docker
  location: us-central1
  repo_format: DOCKER
  repo_description: "Docker images for my application"
  docker_immutable_tags: false
  labels:
    environment: production
    team: platform
  services:
    data:
      protocol: custom
  depends:
    wait-for:
      runnables:
        - gcp-example/enable-apis
      timeout: 300

# =============================================================================
# Step 13: Cloud CDN Backend Bucket
# =============================================================================
# Serve static content from a GCS bucket through Cloud CDN.

cdn-static-assets:
  defines: gcp/cloud-cdn-backend-bucket
  name: my-app-static-cdn
  bucket_name: my-app-storage-bucket-unique-name
  enable_cdn: true
  cache_mode: CACHE_ALL_STATIC
  default_ttl: 3600
  max_ttl: 86400
  compression_mode: AUTOMATIC
  custom_response_headers:
    - "X-Cache-Status:{cdn_cache_status}"
  depends:
    wait-for:
      runnables:
        - gcp-example/app-bucket
      timeout: 300

# =============================================================================
# Step 14: Cloud CDN Backend Service
# =============================================================================
# CDN-enabled backend service for dynamic content with caching.

