# GCP Identity-Aware Proxy (IAP) — Example Stack
#
# Demonstrates a typical IAP workflow:
#   1. Adopt the project OAuth brand
#   2. Create an IAP OAuth client under the brand
#   3. Grant project-wide IAP web access to a list of members
#   4. (Optionally) create a tunnel dest group for TCP forwarding scope
#   5. (Optionally) attach IAP settings to a Compute backend service

namespace: gcp-iap-example

# ============================================================================
# Step 1: Adopt existing OAuth brand
# ============================================================================
# The brand must already exist in the project (create via Cloud Console →
# APIs & Services → OAuth consent screen). This entity only adopts.

iap-brand:
  defines: gcp/iap-brand
  services:
    data:
      protocol: custom

# ============================================================================
# Step 2: Create an IAP OAuth client under the brand
# ============================================================================
# The client secret is written to a Monk secret for other entities to read.

iap-oauth-client:
  defines: gcp/iap-oauth-client
  brand_id: <- connection-target("brand") entity-state get-member("brand_id")
  display_name: "example-iap-client"
  secret_ref: gcp-iap-oauth-client-secret
  permitted-secrets:
    gcp-iap-oauth-client-secret: true
  connections:
    brand:
      runnable: gcp-iap-example/iap-brand
      service: data
  depends:
    wait-for:
      runnables:
        - gcp-iap-example/iap-brand
      timeout: 60
  services:
    data:
      protocol: custom

# ============================================================================
# Step 3: Grant IAP web access at the project level
# ============================================================================
# This binds `roles/iap.httpsResourceAccessor` to specified members on the
# project-wide IAP resource. Only members added by this entity are tracked
# for clean removal on delete.

iap-project-access:
  defines: gcp/iap-access-policy
  target_kind: project
  role: "roles/iap.httpsResourceAccessor"
  members:
    - "user:admin@example.com"
    - "group:engineering@example.com"
  depends:
    wait-for:
      runnables:
        - gcp-iap-example/iap-oauth-client
      timeout: 60

# ============================================================================
# Step 4 (optional): Tunnel destination group for TCP forwarding scope
# ============================================================================

iap-tunnel-group:
  defines: gcp/iap-tunnel-dest-group
  name: example-tunnel-group
  location: us-central1
  cidrs:
    - 10.0.0.0/24
  fqdns:
    - internal-bastion.example.com

# ============================================================================
# Step 5 (optional): Apply IAP settings to a Compute backend service
# ============================================================================
# Requires an existing Compute Engine backend service. `oauth_settings.client_id`
# comes from the iap-oauth-client state; the client secret is read from Monk
# secrets via ArrowScript.

