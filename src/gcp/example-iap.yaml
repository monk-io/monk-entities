#   defines: gcp/iap-settings
#   target_kind: compute
#   backend_service: my-backend-service-id
#   access_settings:
#     oauth_settings:
#       client_id: <- connection-target("oauth") entity-state get-member("client_id")
#       client_secret: <- secret("gcp-iap-oauth-client-secret")
#     cors_settings:
#       allow_http_options: false
#     reauth_settings:
#       method: LOGIN
#       max_age: "3600s"
#       policy_type: DEFAULT
