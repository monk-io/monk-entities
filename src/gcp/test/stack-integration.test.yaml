# GCP Entities Integration Test Suite
#
# This test suite verifies the complete lifecycle of GCP entities.
# Run with: sudo INPUT_DIR=./src/gcp/ ./monkec.sh test --verbose

name: GCP Entities Integration Test
description: Complete integration test for all GCP entities
timeout: 900000 # 15 minutes - Cloud SQL takes time

secrets:
  global: {}

setup:
  - name: Load compiled GCP entity package
    action: load
    target: dist/input/gcp/MANIFEST
    expect:
      exitCode: 0

  - name: Load test stack template
    action: load
    target: test/stack-template.yaml
    expect:
      exitCode: 0

tests:
  # =========================================================================
  # Service Usage Tests
  # =========================================================================
  - name: Enable GCP APIs
    action: run
    target: gcp-test/test-enable-apis
    expect:
      exitCode: 0

  - name: Wait for APIs to be enabled
    action: wait
    target: gcp-test/test-enable-apis
    waitFor:
      condition: ready
      timeout: 120000

  # =========================================================================
  # Pub/Sub Tests (fast, run early)
  # =========================================================================
  - name: Create Pub/Sub topic
    action: run
    target: gcp-test/test-pubsub-topic
    args:
      tag: "local"
    expect:
      exitCode: 0

  - name: Wait for Pub/Sub topic to be ready
    action: wait
    target: gcp-test/test-pubsub-topic
    waitFor:
      condition: ready
      timeout: 60000

  - name: Test Pub/Sub topic get-info action
    action: action
    target: gcp-test/test-pubsub-topic
    actionName: get-info
    expect:
      exitCode: 0

  - name: Create Pub/Sub subscription
    action: run
    target: gcp-test/test-pubsub-subscription
    args:
      tag: "local"
    expect:
      exitCode: 0

  - name: Wait for Pub/Sub subscription to be ready
    action: wait
    target: gcp-test/test-pubsub-subscription
    waitFor:
      condition: ready
      timeout: 60000

  - name: Test Pub/Sub subscription get-info action
    action: action
    target: gcp-test/test-pubsub-subscription
    actionName: get-info
    expect:
      exitCode: 0

  - name: Test Pub/Sub publish action
    action: action
    target: gcp-test/test-pubsub-topic
    actionName: publish
    args:
      message: "Hello from MonkEC integration test"
    expect:
      exitCode: 0

  - name: Test Pub/Sub pull-messages action
    action: action
    target: gcp-test/test-pubsub-subscription
    actionName: pull-messages
    args:
      max_messages: "5"
    expect:
      exitCode: 0

  - name: Test Pub/Sub topic list-subscriptions action
    action: action
    target: gcp-test/test-pubsub-topic
    actionName: list-subscriptions
    expect:
      exitCode: 0

  - name: Test Pub/Sub topic costs action
    action: action
    target: gcp-test/test-pubsub-topic
    actionName: costs
    expect:
      exitCode: 0

  - name: Test Pub/Sub subscription costs action
    action: action
    target: gcp-test/test-pubsub-subscription
    actionName: costs
    expect:
      exitCode: 0

  # =========================================================================
  # Cloud DNS Tests (fast, run early)
  # =========================================================================
  - name: Create Cloud DNS zone
    action: run
    target: gcp-test/test-dns-zone
    args:
      tag: "local"
    expect:
      exitCode: 0

  - name: Wait for Cloud DNS zone to be ready
    action: wait
    target: gcp-test/test-dns-zone
    waitFor:
      condition: ready
      timeout: 60000

  - name: Test Cloud DNS zone get-info action
    action: action
    target: gcp-test/test-dns-zone
    actionName: get-info
    expect:
      exitCode: 0

  - name: Create Cloud DNS record set
    action: run
    target: gcp-test/test-dns-record
    args:
      tag: "local"
    expect:
      exitCode: 0

  - name: Wait for Cloud DNS record set to be ready
    action: wait
    target: gcp-test/test-dns-record
    waitFor:
      condition: ready
      timeout: 60000

  - name: Test Cloud DNS record set get-info action
    action: action
    target: gcp-test/test-dns-record
    actionName: get-info
    expect:
      exitCode: 0

  - name: Test Cloud DNS zone list-record-sets action
    action: action
    target: gcp-test/test-dns-zone
    actionName: list-record-sets
    expect:
      exitCode: 0

  - name: Test Cloud DNS zone costs action
    action: action
    target: gcp-test/test-dns-zone
    actionName: costs
    expect:
      exitCode: 0

  # =========================================================================
  # Artifact Registry Tests
  # =========================================================================
  - name: Create Artifact Registry repository
    action: run
    target: gcp-test/test-artifact-registry
    args:
      tag: "local"
    expect:
      exitCode: 0

  - name: Wait for Artifact Registry repository to be ready
    action: wait
    target: gcp-test/test-artifact-registry
    waitFor:
      condition: ready
      timeout: 120000

  - name: Test Artifact Registry get-info action
    action: action
    target: gcp-test/test-artifact-registry
    actionName: get-info
    expect:
      exitCode: 0

  - name: Test Artifact Registry list-packages action
    action: action
    target: gcp-test/test-artifact-registry
    actionName: list-packages
    expect:
      exitCode: 0

  - name: Test Artifact Registry costs action
    action: action
    target: gcp-test/test-artifact-registry
    actionName: costs
    expect:
      exitCode: 0

  # =========================================================================
  # Cloud CDN Backend Bucket Tests
  # =========================================================================
  - name: Create Cloud CDN backend bucket
    action: run
    target: gcp-test/test-cdn-backend-bucket
    args:
      tag: "local"
    expect:
      exitCode: 0

  - name: Wait for CDN backend bucket to be ready
    action: wait
    target: gcp-test/test-cdn-backend-bucket
    waitFor:
      condition: ready
      timeout: 120000

  - name: Test CDN backend bucket get-info action
    action: action
    target: gcp-test/test-cdn-backend-bucket
    actionName: get-info
    expect:
      exitCode: 0

  - name: Test CDN backend bucket costs action
    action: action
    target: gcp-test/test-cdn-backend-bucket
    actionName: costs
    expect:
      exitCode: 0

  # =========================================================================
  # Cloud CDN Backend Service Tests
  # =========================================================================
  - name: Create Cloud CDN backend service
    action: run
    target: gcp-test/test-cdn-backend-service
    args:
      tag: "local"
    expect:
      exitCode: 0

  - name: Wait for CDN backend service to be ready
    action: wait
    target: gcp-test/test-cdn-backend-service
    waitFor:
      condition: ready
      timeout: 120000

  - name: Test CDN backend service get-info action
    action: action
    target: gcp-test/test-cdn-backend-service
    actionName: get-info
    expect:
      exitCode: 0

  - name: Test CDN backend service costs action
    action: action
    target: gcp-test/test-cdn-backend-service
    actionName: costs
    expect:
      exitCode: 0

  # =========================================================================
  # BigQuery Tests (fast, run first)
  # =========================================================================
  - name: Create BigQuery dataset
    action: run
    target: gcp-test/test-bigquery
    expect:
      exitCode: 0

  - name: Wait for BigQuery dataset to be ready
    action: wait
    target: gcp-test/test-bigquery
    waitFor:
      condition: ready
      timeout: 60000

  - name: Test BigQuery get action
    action: action
    target: gcp-test/test-bigquery
    actionName: get
    expect:
      exitCode: 0

  # =========================================================================
  # Cloud Storage Tests
  # =========================================================================
  - name: Create Cloud Storage bucket
    action: run
    target: gcp-test/test-storage
    expect:
      exitCode: 0

  - name: Wait for Cloud Storage bucket to be ready
    action: wait
    target: gcp-test/test-storage
    waitFor:
      condition: ready
      timeout: 60000

  - name: Test Cloud Storage get action
    action: action
    target: gcp-test/test-storage
    actionName: get
    expect:
      exitCode: 0

  # =========================================================================
  # Memorystore for Redis Tests
  # =========================================================================
  - name: Create Memorystore for Redis instance
    action: run
    target: gcp-test/test-memorystore
    expect:
      exitCode: 0

  - name: Wait for Memorystore instance to be ready
    action: wait
    target: gcp-test/test-memorystore
    waitFor:
      condition: ready
      timeout: 300000 # 5 minutes

  - name: Test Memorystore get-info action
    action: action
    target: gcp-test/test-memorystore
    actionName: get-info
    expect:
      exitCode: 0

  - name: Test Memorystore get-backup-info action
    action: action
    target: gcp-test/test-memorystore
    actionName: get-backup-info
    expect:
      exitCode: 0

  - name: Test Memorystore list-snapshots action
    action: action
    target: gcp-test/test-memorystore
    actionName: list-snapshots
    expect:
      exitCode: 0

  # =========================================================================
  # Service Account Tests
  # =========================================================================
  - name: Create service account
    action: run
    target: gcp-test/test-service-account
    expect:
      exitCode: 0

  - name: Wait for service account to be ready
    action: wait
    target: gcp-test/test-service-account
    waitFor:
      condition: ready
      timeout: 60000

  - name: Create service account key
    action: run
    target: gcp-test/test-service-account-key
    expect:
      exitCode: 0

  - name: Wait for service account key to be ready
    action: wait
    target: gcp-test/test-service-account-key
    waitFor:
      condition: ready
      timeout: 60000

  - name: Create Cloud Storage HMAC keys
    action: run
    target: gcp-test/test-storage-hmac-keys
    expect:
      exitCode: 0

  - name: Wait for Cloud Storage HMAC keys to be ready
    action: wait
    target: gcp-test/test-storage-hmac-keys
    waitFor:
      condition: ready
      timeout: 60000

  # =========================================================================
  # Cloud SQL Tests (slowest, run last)
  # =========================================================================
  - name: Create Cloud SQL instance
    action: run
    target: gcp-test/test-sql-instance
    expect:
      exitCode: 0

  - name: Wait for Cloud SQL instance to be ready
    action: wait
    target: gcp-test/test-sql-instance
    waitFor:
      condition: ready
      timeout: 600000 # 10 minutes for instance creation

  - name: Test Cloud SQL get-info action
    action: action
    target: gcp-test/test-sql-instance
    actionName: get-info
    expect:
      exitCode: 0

  - name: Create Cloud SQL database
    action: run
    target: gcp-test/test-sql-database
    expect:
      exitCode: 0

  - name: Wait for Cloud SQL database to be ready
    action: wait
    target: gcp-test/test-sql-database
    waitFor:
      condition: ready
      timeout: 120000

  - name: Create Cloud SQL user
    action: run
    target: gcp-test/test-sql-user
    expect:
      exitCode: 0

  - name: Wait for Cloud SQL user to be ready
    action: wait
    target: gcp-test/test-sql-user
    waitFor:
      condition: ready
      timeout: 120000

cleanup:
  # Delete in reverse dependency order
  - name: Delete Artifact Registry repository
    action: delete
    target: gcp-test/test-artifact-registry
    expect:
      exitCode: 0

  - name: Delete Cloud DNS record set
    action: delete
    target: gcp-test/test-dns-record
    expect:
      exitCode: 0

  - name: Delete Cloud DNS zone
    action: delete
    target: gcp-test/test-dns-zone
    expect:
      exitCode: 0

  - name: Delete Pub/Sub subscription
    action: delete
    target: gcp-test/test-pubsub-subscription
    expect:
      exitCode: 0

  - name: Delete Pub/Sub topic
    action: delete
    target: gcp-test/test-pubsub-topic
    expect:
      exitCode: 0

  - name: Delete Memorystore instance
    action: delete
    target: gcp-test/test-memorystore
    expect:
      exitCode: 0

  - name: Delete Cloud SQL user
    action: delete
    target: gcp-test/test-sql-user
    expect:
      exitCode: 0

  - name: Delete Cloud SQL database
    action: delete
    target: gcp-test/test-sql-database
    expect:
      exitCode: 0

  - name: Delete Cloud SQL instance
    action: delete
    target: gcp-test/test-sql-instance
    expect:
      exitCode: 0

  - name: Delete service account key
    action: delete
    target: gcp-test/test-service-account-key
    expect:
      exitCode: 0

  - name: Delete Cloud Storage HMAC keys
    action: delete
    target: gcp-test/test-storage-hmac-keys
    expect:
      exitCode: 0

  - name: Delete service account
    action: delete
    target: gcp-test/test-service-account
    expect:
      exitCode: 0

  - name: Delete Cloud CDN backend bucket
    action: delete
    target: gcp-test/test-cdn-backend-bucket
    expect:
      exitCode: 0

  - name: Delete Cloud CDN backend service
    action: delete
    target: gcp-test/test-cdn-backend-service
    expect:
      exitCode: 0

  - name: Delete Cloud Storage bucket
    action: delete
    target: gcp-test/test-storage
    expect:
      exitCode: 0

  - name: Delete BigQuery dataset
    action: delete
    target: gcp-test/test-bigquery
    expect:
      exitCode: 0
