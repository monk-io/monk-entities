namespace: gcp-iap-test

# ----------------------------------------------------------------------------
# Step 0: Enable IAP API on the project
# ----------------------------------------------------------------------------
# Prerequisite for all IAP operations.

enable-iap-api:
  defines: gcp/service-usage
  apis:
    - iap.googleapis.com

# ----------------------------------------------------------------------------
# Step 1: Adopt existing OAuth brand
# ----------------------------------------------------------------------------
# The test GCP project MUST already have an OAuth consent screen configured
# (APIs & Services → OAuth consent screen). Otherwise this entity will throw.

test-iap-brand:
  defines: gcp/iap-brand
  services:
    data:
      protocol: custom

# ----------------------------------------------------------------------------
# Step 2: Create IAP OAuth client under the brand
# ----------------------------------------------------------------------------
# OAuth client secret is written to the Monk secret gcp-iap-test-client-secret.

test-iap-oauth-client:
  defines: gcp/iap-oauth-client
  brand_id: <- connection-target("brand") entity-state get-member("brand_id")
  display_name: monk-iap-test-client
  secret_ref: gcp-iap-test-client-secret
  permitted-secrets:
    gcp-iap-test-client-secret: true
  connections:
    brand:
      runnable: gcp-iap-test/test-iap-brand
      service: data
  depends:
    wait-for:
      runnables:
        - gcp-iap-test/test-iap-brand
      timeout: 60
  services:
    data:
      protocol: custom

# ----------------------------------------------------------------------------
# Step 3: Tunnel destination group
# ----------------------------------------------------------------------------
# Simple CRUD — no dependencies.

test-iap-tunnel-group:
  defines: gcp/iap-tunnel-dest-group
  name: monk-iap-test-group
  location: us-central1
  cidrs:
    - 10.0.0.0/24
  fqdns:
    - test.example.internal

# ----------------------------------------------------------------------------
# Step 4: Project-wide IAP access policy
# ----------------------------------------------------------------------------
# Binds roles/iap.httpsResourceAccessor to allAuthenticatedUsers on the
# project-wide IAP resource. This is safe in a test project because IAP
# only enforces on actual IAP-protected resources (of which the test project
# typically has none).

test-iap-access-policy:
  defines: gcp/iap-access-policy
  target_kind: project
  role: roles/iap.httpsResourceAccessor
  members:
    - "allAuthenticatedUsers"
