# Cloud Run Integration Test Template
# Tests Cloud Run Service and Job entities

namespace: gcp-cloud-run-test

# Cloud Run Service — deploys a simple hello container
test-service:
  defines: gcp/cloud-run-service
  name: monk-test-cr-service
  location: us-central1
  image: us-docker.pkg.dev/cloudrun/container/hello
  port: 8080
  cpu: "1"
  memory: 512Mi
  min_instances: 0
  max_instances: 3
  concurrency: 80
  timeout_seconds: 300
  allow_unauthenticated: true
  labels:
    monk-test: cloud-run
  services:
    data:
      protocol: custom

# IAP settings applied to the cloud-run service above.
# Requires iap.googleapis.com enabled in the project.
test-iap-settings:
  defines: gcp/iap-settings
  target_kind: cloud-run
  region: us-central1
  cloud_run_service: monk-test-cr-service
  access_settings:
    cors_settings:
      allow_http_options: false
  application_settings:
    cookie_domain: test.example.com
    access_denied_page_settings:
      generate_troubleshooting_uri: true
  depends:
    wait-for:
      runnables:
        - gcp-cloud-run-test/test-service
      timeout: 120

# Cloud Run Job — runs a simple container to completion
test-job:
  defines: gcp/cloud-run-job
  name: monk-test-cr-job
  location: us-central1
  image: us-docker.pkg.dev/cloudrun/container/hello
  cpu: "1"
  memory: 512Mi
  task_count: 1
  timeout_seconds: 120
  max_retries: 1
  labels:
    monk-test: cloud-run
