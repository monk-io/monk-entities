# OAuth Client + Credential Test Template
# Covers gcp/o-auth-client and gcp/o-auth-client-credential.
# Requires IAM API enabled and roles/iam.oauthClientAdmin on the caller.

namespace: gcp-oauth-test

enable-iam-api:
  defines: gcp/service-usage
  apis:
    - iam.googleapis.com

# Confidential OAuth client for a hypothetical web app
test-oauth-client:
  defines: gcp/o-auth-client
  name: monk-test-oauth-client
  display_name: Monk Test OAuth Client
  client_description: Integration test OAuth client
  client_type: CONFIDENTIAL_CLIENT
  allowed_grant_types:
    - AUTHORIZATION_CODE_GRANT
    - REFRESH_TOKEN_GRANT
  allowed_redirect_uris:
    - https://test.example.com/oauth2/callback
  allowed_scopes:
    - https://www.googleapis.com/auth/cloud-platform
  services:
    oauth-client:
      protocol: custom
  depends:
    wait-for:
      runnables:
        - gcp-oauth-test/enable-iam-api
      timeout: 180

# Credential (client secret) for the client above
test-oauth-credential:
  defines: gcp/o-auth-client-credential
  name: monk-test-secret-v1
  oauth_client_id: <- connection-target("client") entity-state get-member("client_id")
  secret: gcp-test-oauth-secret
  display_name: Monk Test Secret v1
  permitted-secrets:
    gcp-test-oauth-secret: true
  connections:
    client:
      runnable: gcp-oauth-test/test-oauth-client
      service: oauth-client
  depends:
    wait-for:
      runnables:
        - gcp-oauth-test/test-oauth-client
      timeout: 60
