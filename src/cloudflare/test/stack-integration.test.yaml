name: Cloudflare Integration Test
description: Load entities, run zone + record + worker script + route stack
timeout: 300000

secrets:
  global:
    cloudflare-api-token: "$CLOUDFLARE_API_TOKEN"
    cloudflare-account-id: "$CLOUDFLARE_ACCOUNT_ID"

setup:
  - name: Load compiled entity (skipped if no Monk permissions)
    action: load
    target: dist/input/cloudflare/MANIFEST
    expect:
      exitCode: 0
    continueOnError: true

  - name: Load stack template
    action: load
    target: stack-template.yaml
    expect:
      exitCode: 0

tests:
  - name: Start stack
    action: run
    target: cloudflare-test/stack
    expect:
      exitCode: 0

  - name: Describe record state
    action: describe
    target: cloudflare-test/record
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/record"
        - "existing"

  - name: Describe zone state
    action: describe
    target: cloudflare-test/zone
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/zone"
        - "existing"

  - name: Describe Worker script state
    action: describe
    target: cloudflare-test/worker
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/worker"
        - "monk-test-worker"

  - name: Describe Workers route state
    action: describe
    target: cloudflare-test/route
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/route"
        - "id"

  - name: List zones
    action: action
    target: cloudflare-test/zone
    actionName: list-zones
    expect:
      exitCode: 0

  - name: Get zone info
    action: action
    target: cloudflare-test/zone
    actionName: get-info
    expect:
      exitCode: 0

  - name: Describe custom hostname state
    action: describe
    target: cloudflare-test/custom-hostname
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/custom-hostname"
        - "monk-test-tenant.monktest.dev"

  - name: Get custom hostname info
    action: action
    target: cloudflare-test/custom-hostname
    actionName: get-info
    expect:
      exitCode: 0
      output:
        - "monk-test-tenant.monktest.dev"

  - name: Trigger custom hostname revalidation
    action: action
    target: cloudflare-test/custom-hostname
    actionName: trigger-revalidation
    expect:
      exitCode: 0

  - name: Describe fallback origin state
    action: describe
    target: cloudflare-test/fallback-origin
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/fallback-origin"
        - "proxy.thisbetterbe.online"

  - name: Get fallback origin info
    action: action
    target: cloudflare-test/fallback-origin
    actionName: get-info
    expect:
      exitCode: 0

  - name: Describe R2 bucket
    action: describe
    target: cloudflare-test/bucket
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/bucket"
        - "id"

  - name: Get R2 bucket info
    action: action
    target: cloudflare-test/bucket
    actionName: get-info
    expect:
      exitCode: 0
      output:
        - "monk-r2-test-bucket"

  - name: Get Worker script info
    action: action
    target: cloudflare-test/worker
    actionName: get-info
    expect:
      exitCode: 0
      output:
        - "compatibility_date"

  - name: Get Workers route info
    action: action
    target: cloudflare-test/route
    actionName: get-info
    expect:
      exitCode: 0
      output:
        - "monk-test-worker"

cleanup:
  - name: Delete stack
    action: delete
    target: cloudflare-test/stack
    expect:
      exitCode: 0
