name: Cloudflare Integration Test
description: Load entities, run zone + record + worker script + route stack
timeout: 300000

secrets:
  global:
    cloudflare-api-token: "$CLOUDFLARE_API_TOKEN"
    cloudflare-account-id: "$CLOUDFLARE_ACCOUNT_ID"

setup:
  - name: Load compiled entity (skipped if no Monk permissions)
    action: load
    target: dist/input/cloudflare/MANIFEST
    expect:
      exitCode: 0
    continueOnError: true

  - name: Load stack template
    action: load
    target: stack-template.yaml
    expect:
      exitCode: 0

tests:
  - name: Start stack
    action: run
    target: cloudflare-test/stack
    expect:
      exitCode: 0

  - name: Describe record state
    action: describe
    target: cloudflare-test/record
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/record"
        - "existing"

  - name: Describe zone state
    action: describe
    target: cloudflare-test/zone
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/zone"
        - "existing"

  - name: Describe Worker script state
    action: describe
    target: cloudflare-test/worker
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/worker"
        - "monk-test-worker"

  - name: Describe Workers route state
    action: describe
    target: cloudflare-test/route
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/route"
        - "id"

  - name: List zones
    action: action
    target: cloudflare-test/zone
    actionName: list-zones
    expect:
      exitCode: 0

  - name: Get zone info
    action: action
    target: cloudflare-test/zone
    actionName: get-info
    expect:
      exitCode: 0

  - name: Get Worker script info
    action: action
    target: cloudflare-test/worker
    actionName: get-info
    expect:
      exitCode: 0
      output:
        - "compatibility_date"

  - name: Get Workers route info
    action: action
    target: cloudflare-test/route
    actionName: get-info
    expect:
      exitCode: 0
      output:
        - "monk-test-worker"

  - name: Describe main queue
    action: describe
    target: cloudflare-test/main-queue
    expect:
      exitCode: 0
      output:
        - "cloudflare-test/main-queue"
        - "monk-test-queue"

  - name: Describe DLQ
    action: describe
    target: cloudflare-test/dlq
    expect:
      exitCode: 0
      output:
        - "monk-test-queue-dlq"

  - name: Get main queue info
    action: action
    target: cloudflare-test/main-queue
    actionName: get-info
    expect:
      exitCode: 0
      output:
        - "monk-test-queue"

  # Functional roundtrip: send and pull from DLQ (no worker consumer
  # attached, so http_pull works). Purge first to drain anything left
  # behind by a previous run.
  - name: Drain DLQ before roundtrip
    action: action
    target: cloudflare-test/dlq
    actionName: drain-messages
    expect:
      exitCode: 0
      output:
        - "Purged"

  - name: Send message to DLQ
    action: action
    target: cloudflare-test/dlq
    actionName: send-message
    expect:
      exitCode: 0
      output:
        - "Sent message"
        - "monk-test"

  - name: Pull message from DLQ
    action: action
    target: cloudflare-test/dlq
    actionName: pull-messages
    expect:
      exitCode: 0
      output:
        - "Pulled"
        - "monk-test"

  # main-queue has a worker consumer attached, so send works but pulls
  # would race with the consumer. Just verify send.
  - name: Send message to main queue
    action: action
    target: cloudflare-test/main-queue
    actionName: send-message
    expect:
      exitCode: 0
      output:
        - "Sent message"

  - name: Describe queue consumer
    action: describe
    target: cloudflare-test/consumer
    expect:
      exitCode: 0
      output:
        - "monk-test-worker"

  - name: Get consumer info
    action: action
    target: cloudflare-test/consumer
    actionName: get-info
    expect:
      exitCode: 0
      output:
        - "monk-test-worker"

  - name: List consumers on queue
    action: action
    target: cloudflare-test/consumer
    actionName: list-consumers
    expect:
      exitCode: 0
      output:
        - "monk-test-worker"

  - name: Describe cron trigger
    action: describe
    target: cloudflare-test/crons
    expect:
      exitCode: 0
      output:
        - "applied_crons"

  - name: Get cron schedules
    action: action
    target: cloudflare-test/crons
    actionName: get-schedules
    expect:
      exitCode: 0
      output:
        - "*/30 * * * *"

cleanup:
  - name: Delete stack
    action: delete
    target: cloudflare-test/stack
    expect:
      exitCode: 0
