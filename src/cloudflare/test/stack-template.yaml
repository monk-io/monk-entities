namespace: cloudflare-test

zone:
  defines: cloudflare/cloudflare-dns-zone
  name: thisbetterbe.online
  permitted-secrets:
    cloudflare-api-token: true
  services:
    data:
      protocol: custom

record:
  defines: cloudflare/cloudflare-dns-record
  zone_name: <- connection-target("zone") entity-state get-member("name")
  record_type: A
  name: www2
  content: 198.51.100.4
  ttl: 1 # automatic
  proxied: true # toggle orange cloud
  permitted-secrets:
    cloudflare-api-token: true
  connections:
    zone:
      runnable: cloudflare-test/zone
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/zone
      timeout: 60

fallback-origin:
  defines: cloudflare/cloudflare-custom-hostname-fallback-origin
  zone_id: <- connection-target("zone") entity-state get-member("id")
  origin: proxy.thisbetterbe.online
  permitted-secrets:
    cloudflare-api-token: true
  connections:
    zone:
      runnable: cloudflare-test/zone
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/zone
      timeout: 60

custom-hostname:
  defines: cloudflare/cloudflare-custom-hostname
  zone_id: <- connection-target("zone") entity-state get-member("id")
  hostname: monk-test-tenant.monktest.dev
  ssl_method: http
  ssl_type: dv
  permitted-secrets:
    cloudflare-api-token: true
  services:
    data:
      protocol: custom
  connections:
    zone:
      runnable: cloudflare-test/zone
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/fallback-origin
      timeout: 60

bucket:
  defines: cloudflare/cloudflare-r2-bucket
  account_id: <- secret("cloudflare-account-id")
  name: monk-r2-test-bucket
  storage_class: Standard
  permitted-secrets:
    cloudflare-api-token: true
    cloudflare-account-id: true
  services:
    data:
      protocol: custom

worker:
  defines: cloudflare/cloudflare-workers-script
  account_id: <- secret("cloudflare-account-id")
  name: monk-test-worker
  compatibility_date: "2025-04-01"
  permitted-secrets:
    cloudflare-api-token: true
    cloudflare-account-id: true
  services:
    data:
      protocol: custom

route:
  defines: cloudflare/cloudflare-workers-route
  zone_id: <- connection-target("zone") entity-state get-member("id")
  route_pattern: "thisbetterbe.online/monk-test-worker/*"
  script_name: <- connection-target("worker") entity-state get-member("id")
  permitted-secrets:
    cloudflare-api-token: true
  connections:
    zone:
      runnable: cloudflare-test/zone
      service: data
    worker:
      runnable: cloudflare-test/worker
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/zone
        - cloudflare-test/worker
      timeout: 60

main-queue:
  defines: cloudflare/cloudflare-queue
  account_id: <- secret("cloudflare-account-id")
  name: monk-test-queue
  settings:
    message_retention_period: 3600
  # Hermetic test: blow it away on teardown.
  allow_destructive_delete: true
  permitted-secrets:
    cloudflare-api-token: true
    cloudflare-account-id: true
  services:
    data:
      protocol: custom

dlq:
  defines: cloudflare/cloudflare-queue
  account_id: <- secret("cloudflare-account-id")
  name: monk-test-queue-dlq
  allow_destructive_delete: true
  permitted-secrets:
    cloudflare-api-token: true
    cloudflare-account-id: true
  services:
    data:
      protocol: custom

dlq-puller:
  defines: cloudflare/cloudflare-queue-consumer
  account_id: <- secret("cloudflare-account-id")
  queue_id: <- connection-target("queue") entity-state get-member("id")
  consumer_type: http_pull
  settings:
    batch_size: 10
    max_retries: 1
    retry_delay: 1
  permitted-secrets:
    cloudflare-api-token: true
    cloudflare-account-id: true
  connections:
    queue:
      runnable: cloudflare-test/dlq
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/dlq
      timeout: 60

consumer:
  defines: cloudflare/cloudflare-queue-consumer
  account_id: <- secret("cloudflare-account-id")
  queue_id: <- connection-target("queue") entity-state get-member("id")
  script_name: <- connection-target("worker") entity-state get-member("id")
  dead_letter_queue: monk-test-queue-dlq
  settings:
    batch_size: 10
    max_concurrency: 1
    max_retries: 3
    max_wait_time_ms: 5000
    retry_delay: 5
  permitted-secrets:
    cloudflare-api-token: true
    cloudflare-account-id: true
  connections:
    queue:
      runnable: cloudflare-test/main-queue
      service: data
    worker:
      runnable: cloudflare-test/worker
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/main-queue
        - cloudflare-test/worker
        - cloudflare-test/dlq
      timeout: 60

pages-project:
  defines: cloudflare/cloudflare-pages-project
  account_id: <- secret("cloudflare-account-id")
  name: monk-test-pages
  production_branch: main
  production_env_vars:
    MONK_TEST: hello-from-monk
  # Hermetic test: blow it away on teardown.
  allow_destructive_delete: true
  permitted-secrets:
    cloudflare-api-token: true
    cloudflare-account-id: true
  services:
    data:
      protocol: custom

pages-domain:
  defines: cloudflare/cloudflare-pages-domain
  account_id: <- secret("cloudflare-account-id")
  project_name: <- connection-target("project") entity-state get-member("id")
  domain: pages-test.thisbetterbe.online
  allow_destructive_delete: true
  permitted-secrets:
    cloudflare-api-token: true
    cloudflare-account-id: true
  connections:
    project:
      runnable: cloudflare-test/pages-project
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/pages-project
        - cloudflare-test/zone
      timeout: 60

crons:
  defines: cloudflare/cloudflare-workers-cron-trigger
  account_id: <- secret("cloudflare-account-id")
  script_name: <- connection-target("worker") entity-state get-member("id")
  crons:
    - "*/30 * * * *"
    - "0 3 * * *"
  permitted-secrets:
    cloudflare-api-token: true
    cloudflare-account-id: true
  connections:
    worker:
      runnable: cloudflare-test/worker
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/worker
      timeout: 60

stack:
  defines: group
  members:
    - cloudflare-test/zone
    - cloudflare-test/record
    - cloudflare-test/fallback-origin
    - cloudflare-test/custom-hostname
    - cloudflare-test/bucket
    - cloudflare-test/worker
    - cloudflare-test/route
    - cloudflare-test/main-queue
    - cloudflare-test/dlq
    - cloudflare-test/dlq-puller
    - cloudflare-test/consumer
    - cloudflare-test/crons
    - cloudflare-test/pages-project
    - cloudflare-test/pages-domain
