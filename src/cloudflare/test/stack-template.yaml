namespace: cloudflare-test

zone:
  defines: cloudflare/cloudflare-dns-zone
  name: thisbetterbe.online
  permitted-secrets:
    cloudflare-api-token: true
  services:
    data:
      protocol: custom

record:
  defines: cloudflare/cloudflare-dns-record
  zone_name: <- connection-target("zone") entity-state get-member("name")
  record_type: A
  name: www2
  content: 198.51.100.4
  ttl: 1 # automatic
  proxied: true # toggle orange cloud
  permitted-secrets:
    cloudflare-api-token: true
  connections:
    zone:
      runnable: cloudflare-test/zone
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/zone
      timeout: 60

fallback-origin:
  defines: cloudflare/cloudflare-custom-hostname-fallback-origin
  zone_id: <- connection-target("zone") entity-state get-member("id")
  origin: proxy.thisbetterbe.online
  permitted-secrets:
    cloudflare-api-token: true
  connections:
    zone:
      runnable: cloudflare-test/zone
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/zone
      timeout: 60

custom-hostname:
  defines: cloudflare/cloudflare-custom-hostname
  zone_id: <- connection-target("zone") entity-state get-member("id")
  hostname: monk-test-tenant.monktest.dev
  ssl_method: http
  ssl_type: dv
  permitted-secrets:
    cloudflare-api-token: true
  services:
    data:
      protocol: custom
  connections:
    zone:
      runnable: cloudflare-test/zone
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/fallback-origin
      timeout: 60

bucket:
  defines: cloudflare/cloudflare-r2-bucket
  account_id: <- secret("cloudflare-account-id")
  name: monk-r2-test-bucket
  storage_class: Standard
  # Tests need cleanup to actually destroy the bucket.
  allow_destructive_delete: true
  permitted-secrets:
    cloudflare-api-token: true
    cloudflare-account-id: true
  services:
    data:
      protocol: custom

worker:
  defines: cloudflare/cloudflare-workers-script
  account_id: <- secret("cloudflare-account-id")
  name: monk-test-worker
  compatibility_date: "2025-04-01"
  # Tests need to be hermetic: allow destructive delete so cleanup wipes
  # the Worker from the account when the stack is torn down.
  allow_destructive_delete: true
  permitted-secrets:
    cloudflare-api-token: true
    cloudflare-account-id: true
  services:
    data:
      protocol: custom

route:
  defines: cloudflare/cloudflare-workers-route
  zone_id: <- connection-target("zone") entity-state get-member("id")
  route_pattern: "thisbetterbe.online/monk-test-worker/*"
  script_name: <- connection-target("worker") entity-state get-member("id")
  permitted-secrets:
    cloudflare-api-token: true
  connections:
    zone:
      runnable: cloudflare-test/zone
      service: data
    worker:
      runnable: cloudflare-test/worker
      service: data
  depends:
    wait-for:
      runnables:
        - cloudflare-test/zone
        - cloudflare-test/worker
      timeout: 60

stack:
  defines: group
  members:
    - cloudflare-test/zone
    - cloudflare-test/record
    - cloudflare-test/fallback-origin
    - cloudflare-test/custom-hostname
    - cloudflare-test/bucket
    - cloudflare-test/worker
    - cloudflare-test/route
