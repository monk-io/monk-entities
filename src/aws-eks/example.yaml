# An EKS cluster and an app on it, from an empty AWS account, in one
# `monk run aws-eks-example/stack`: a VPC with two public subnets, the IAM
# roles EKS needs, the cluster, a node group, the EBS CSI driver and a
# default storage class, and a web app behind a load balancer.
#
# Everything uses the Monk cluster's AWS credentials; no kubeconfig. The
# cluster takes 10 to 15 minutes, the nodes a few more.
#
# Deleting: the node group goes first, then the cluster, each of which AWS
# takes some minutes to finish; if deleting the cluster or the VPC says it
# is still in use, run the delete again a little later.
namespace: aws-eks-example

vpc:
  defines: aws-ec2/vpc
  region: us-east-1
  cidr_block: 10.20.0.0/16
  enable_dns_support: true
  enable_dns_hostnames: true
  tags:
    Name: shop
  services:
    data:
      protocol: custom

gateway:
  defines: aws-ec2/internet-gateway
  region: us-east-1
  vpc_id: <- connection-target("vpc") entity-state get-member("vpc_id")
  services:
    data:
      protocol: custom
  connections:
    vpc:
      runnable: aws-eks-example/vpc
      service: data
  depends:
    wait-for:
      runnables:
        - aws-eks-example/vpc
      timeout: 120

subnet-a:
  defines: aws-ec2/subnet
  region: us-east-1
  vpc_id: <- connection-target("vpc") entity-state get-member("vpc_id")
  cidr_block: 10.20.1.0/24
  availability_zone: us-east-1a
  map_public_ip_on_launch: true
  tags:
    kubernetes.io/role/elb: "1"   # where load balancers for Services go
  services:
    data:
      protocol: custom
  connections:
    vpc:
      runnable: aws-eks-example/vpc
      service: data
  depends:
    wait-for:
      runnables:
        - aws-eks-example/vpc
      timeout: 120

subnet-b:
  defines: aws-ec2/subnet
  region: us-east-1
  vpc_id: <- connection-target("vpc") entity-state get-member("vpc_id")
  cidr_block: 10.20.2.0/24
  availability_zone: us-east-1b
  map_public_ip_on_launch: true
  tags:
    kubernetes.io/role/elb: "1"
  services:
    data:
      protocol: custom
  connections:
    vpc:
      runnable: aws-eks-example/vpc
      service: data
  depends:
    wait-for:
      runnables:
        - aws-eks-example/vpc
      timeout: 120

routes:
  defines: aws-ec2/route-table
  region: us-east-1
  vpc_id: <- connection-target("vpc") entity-state get-member("vpc_id")
  routes:
    - destination_cidr_block: 0.0.0.0/0
      gateway_id: <- connection-target("gateway") entity-state get-member("internet_gateway_id")
  subnet_ids:
    - <- connection-target("subnet-a") entity-state get-member("subnet_id")
    - <- connection-target("subnet-b") entity-state get-member("subnet_id")
  services:
    data:
      protocol: custom
  connections:
    vpc:
      runnable: aws-eks-example/vpc
      service: data
    gateway:
      runnable: aws-eks-example/gateway
      service: data
    subnet-a:
      runnable: aws-eks-example/subnet-a
      service: data
    subnet-b:
      runnable: aws-eks-example/subnet-b
      service: data
  depends:
    wait-for:
      runnables:
        - aws-eks-example/gateway
        - aws-eks-example/subnet-a
        - aws-eks-example/subnet-b
      timeout: 120

cluster-role:
  defines: aws-iam/iam-role
  region: us-east-1
  role_name: shop-eks-cluster
  assume_role_policy_document:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: eks.amazonaws.com
        Action:
          - sts:AssumeRole
          - sts:TagSession
  attached_policies:
    - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
  services:
    data:
      protocol: custom

node-role:
  defines: aws-iam/iam-role
  region: us-east-1
  role_name: shop-eks-nodes
  assume_role_policy_document:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: ec2.amazonaws.com
        Action: sts:AssumeRole
  attached_policies:
    - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
    - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
    - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
    - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
  services:
    data:
      protocol: custom

eks:
  defines: aws-eks/cluster
  region: us-east-1
  name: shop
  version: "1.33"                 # quoted: YAML reads 1.30 as 1.3
  role_arn: <- connection-target("cluster-role") entity-state get-member("role_arn")
  subnet_ids:
    - <- connection-target("subnet-a") entity-state get-member("subnet_id")
    - <- connection-target("subnet-b") entity-state get-member("subnet_id")
  services:
    data:
      protocol: custom
  connections:
    cluster-role:
      runnable: aws-eks-example/cluster-role
      service: data
    subnet-a:
      runnable: aws-eks-example/subnet-a
      service: data
    subnet-b:
      runnable: aws-eks-example/subnet-b
      service: data
  depends:
    wait-for:
      runnables:
        - aws-eks-example/cluster-role
        - aws-eks-example/routes
      timeout: 120

nodes:
  defines: aws-eks/node-group
  region: us-east-1
  cluster_name: <- connection-target("eks") entity-state get-member("name")
  name: general
  node_role_arn: <- connection-target("node-role") entity-state get-member("role_arn")
  subnet_ids:
    - <- connection-target("subnet-a") entity-state get-member("subnet_id")
    - <- connection-target("subnet-b") entity-state get-member("subnet_id")
  instance_types: [t3.medium]
  desired_size: 2
  max_size: 4
  services:
    data:
      protocol: custom
  connections:
    eks:
      runnable: aws-eks-example/eks
      service: data
    node-role:
      runnable: aws-eks-example/node-role
      service: data
    subnet-a:
      runnable: aws-eks-example/subnet-a
      service: data
    subnet-b:
      runnable: aws-eks-example/subnet-b
      service: data
  depends:
    wait-for:
      runnables:
        - aws-eks-example/eks
        - aws-eks-example/node-role
      timeout: 1800

ebs:
  defines: aws-eks/addon
  region: us-east-1
  cluster_name: <- connection-target("eks") entity-state get-member("name")
  name: aws-ebs-csi-driver
  services:
    data:
      protocol: custom
  connections:
    eks:
      runnable: aws-eks-example/eks
      service: data
  depends:
    wait-for:
      runnables:
        - aws-eks-example/nodes
      timeout: 1200

# From here on, the k8s entities: the cluster is reached by name, with the
# Monk cluster's AWS credentials, which created it and so are its admin.
k8s:
  defines: k8s/cluster
  eks_cluster: <- connection-target("eks") entity-state get-member("name")
  eks_region: <- connection-target("eks") entity-state get-member("region")
  services:
    data:
      protocol: custom
  connections:
    eks:
      runnable: aws-eks-example/eks
      service: data
  depends:
    wait-for:
      runnables:
        - aws-eks-example/nodes
      timeout: 1200

storage-class:
  defines: k8s/resource
  eks_cluster: <- connection-target("eks") entity-state get-member("name")
  eks_region: <- connection-target("eks") entity-state get-member("region")
  manifest: |
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: gp3
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
    provisioner: ebs.csi.aws.com
    volumeBindingMode: WaitForFirstConsumer
    parameters:
      type: gp3
  services:
    data:
      protocol: custom
  connections:
    eks:
      runnable: aws-eks-example/eks
      service: data
  depends:
    wait-for:
      runnables:
        - aws-eks-example/ebs
        - aws-eks-example/k8s
      timeout: 300

web:
  defines: k8s/deployment
  eks_cluster: <- connection-target("eks") entity-state get-member("name")
  eks_region: <- connection-target("eks") entity-state get-member("region")
  namespace: default
  image: nginx:1.27-alpine
  replicas: 2
  ports: [80]
  service_type: LoadBalancer
  readiness_path: /
  storage:
    cache:
      path: /var/cache/nginx
      size: 1Gi
  services:
    data:
      protocol: custom
  connections:
    eks:
      runnable: aws-eks-example/eks
      service: data
  depends:
    wait-for:
      runnables:
        - aws-eks-example/storage-class
      timeout: 300

stack:
  defines: group
  members:
    - aws-eks-example/vpc
    - aws-eks-example/gateway
    - aws-eks-example/subnet-a
    - aws-eks-example/subnet-b
    - aws-eks-example/routes
    - aws-eks-example/cluster-role
    - aws-eks-example/node-role
    - aws-eks-example/eks
    - aws-eks-example/nodes
    - aws-eks-example/ebs
    - aws-eks-example/k8s
    - aws-eks-example/storage-class
    - aws-eks-example/web
