namespace: clerk-example

creds:
  defines: clerk/credentials
  permitted-secrets:
    clerk-secret-key: true
  secret_ref: clerk-secret-key
  publishable_key: "pk_test_example"
  services:
    data:
      protocol: custom

org:
  defines: clerk/organization
  secret_ref: clerk-secret-key
  name: example-org
  slug: example-org
  max_allowed_memberships: 100
  permitted-secrets:
    clerk-secret-key: true
  services:
    data:
      protocol: custom

jwt:
  defines: clerk/jwt-template
  secret_ref: clerk-secret-key
  name: example-jwt
  lifetime: 3600
  claims:
    role: "{{user.public_metadata.role}}"
  permitted-secrets:
    clerk-secret-key: true
  services:
    data:
      protocol: custom

domain:
  defines: clerk/domain
  secret_ref: clerk-secret-key
  name: auth.example.com
  is_satellite: false
  permitted-secrets:
    clerk-secret-key: true
  services:
    data:
      protocol: custom

oauth:
  defines: clerk/o-auth-application
  secret_ref: clerk-secret-key
  name: example-oauth-app
  callback_url: https://example.com/oauth/callback
  client_secret_ref: clerk-oauth-client-secret
  permitted-secrets:
    clerk-secret-key: true
    clerk-oauth-client-secret: true
  services:
    data:
      protocol: custom

consumer:
  defines: runnable
  permitted-secrets:
    clerk-secret-key: true
    clerk-oauth-client-secret: true
  connections:
    creds:
      runnable: clerk-example/creds
      service: data
    org:
      runnable: clerk-example/org
      service: data
    oauth:
      runnable: clerk-example/oauth
      service: data
  depends:
    wait-for:
      runnables:
        - clerk-example/creds
        - clerk-example/org
        - clerk-example/jwt
        - clerk-example/domain
        - clerk-example/oauth
      timeout: 60
  variables:
    clerk_secret_ref:
      value: <- connection-target("creds") entity get-member("secret_ref")
      type: string
    oauth_secret_ref:
      value: <- connection-target("oauth") entity-state get-member("client_secret_secret")
      type: string
    CLERK_SECRET_KEY:
      env: CLERK_SECRET_KEY
      type: string
      value: <- secret($clerk_secret_ref)
    CLERK_PUBLISHABLE_KEY:
      env: CLERK_PUBLISHABLE_KEY
      type: string
      value: <- connection-target("creds") entity-state get-member("publishable_key")
    CLERK_MODE:
      env: CLERK_MODE
      type: string
      value: <- connection-target("creds") entity-state get-member("mode")
    CLERK_ORG_ID:
      env: CLERK_ORG_ID
      type: string
      value: <- connection-target("org") entity-state get-member("organization_id")
    CLERK_OAUTH_CLIENT_ID:
      env: CLERK_OAUTH_CLIENT_ID
      type: string
      value: <- connection-target("oauth") entity-state get-member("client_id")
    CLERK_OAUTH_CLIENT_SECRET:
      env: CLERK_OAUTH_CLIENT_SECRET
      type: string
      value: <- secret($oauth_secret_ref)
  containers:
    app:
      image: curlimages/curl:8.10.1
      entrypoint: sleep 36000
