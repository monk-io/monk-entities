# EKS import demo, part 3: a change made outside Monk, the way the team
# would make it: helm upgrade and kubectl set image, from inside the cluster.
namespace: eks-import-demo

change:
  defines: k8s/resource
  eks_cluster: <- connection-target("eks") entity-state get-member("name")
  eks_region: <- connection-target("eks") entity-state get-member("region")
  manifest: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: change
      namespace: import-seed
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: seeder
          restartPolicy: Never
          containers:
            - name: change
              image: alpine/k8s:1.34.12
              command:
                - sh
                - -c
                - |
                  set -eu
                  helm upgrade web oci://ghcr.io/stefanprodan/charts/podinfo --version 6.11.0 \
                    --namespace shop --reuse-values --set replicaCount=3 --wait --timeout 10m
                  kubectl -n shop set image deploy/worker worker=busybox:1.36
                  kubectl -n shop rollout status deploy/worker --timeout=5m
                  kubectl -n shop delete configmap worker-settings
  services:
    data:
      protocol: custom
  connections:
    eks:
      runnable: eks-import-demo/eks
      service: data
