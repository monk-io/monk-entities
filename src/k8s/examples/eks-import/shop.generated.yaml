# Generated by k8s/inventory from namespace shop.
# Every entity observes its object and never changes it (mode: observe).
# Secret values stay on the cluster.
namespace: shop

configmap-web-podinfo-redis:
  # managed by helm:web
  defines: k8s/resource
  mode: observe
  eks_cluster: "import-demo"
  eks_region: "us-east-1"
  namespace: "shop"
  manifest: |
    {
      "apiVersion": "v1",
      "data": {
        "redis.conf": "maxmemory 64mb\nmaxmemory-policy allkeys-lru\nsave \"\"\nappendonly no\n"
      },
      "kind": "ConfigMap",
      "metadata": {
        "annotations": {
          "meta.helm.sh/release-name": "web",
          "meta.helm.sh/release-namespace": "shop"
        },
        "labels": {
          "app.kubernetes.io/managed-by": "Helm"
        },
        "name": "web-podinfo-redis",
        "namespace": "shop"
      }
    }
  crons:
    refresh:
      action: refresh
      every: 120

configmap-worker-settings:
  defines: k8s/resource
  mode: observe
  eks_cluster: "import-demo"
  eks_region: "us-east-1"
  namespace: "shop"
  manifest: |
    {
      "apiVersion": "v1",
      "data": {
        "BATCH": "20",
        "QUEUE": "orders"
      },
      "kind": "ConfigMap",
      "metadata": {
        "name": "worker-settings",
        "namespace": "shop"
      }
    }
  crons:
    refresh:
      action: refresh
      every: 120

deployment-web-podinfo:
  # managed by helm:web
  defines: k8s/resource
  mode: observe
  eks_cluster: "import-demo"
  eks_region: "us-east-1"
  namespace: "shop"
  manifest: |
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "annotations": {
          "meta.helm.sh/release-name": "web",
          "meta.helm.sh/release-namespace": "shop"
        },
        "labels": {
          "app.kubernetes.io/managed-by": "Helm",
          "app.kubernetes.io/name": "web-podinfo",
          "app.kubernetes.io/version": "6.11.0",
          "helm.sh/chart": "podinfo-6.11.0"
        },
        "name": "web-podinfo",
        "namespace": "shop"
      },
      "spec": {
        "progressDeadlineSeconds": 600,
        "replicas": 2,
        "revisionHistoryLimit": 10,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "web-podinfo"
          }
        },
        "strategy": {
          "rollingUpdate": {
            "maxSurge": "25%",
            "maxUnavailable": 1
          },
          "type": "RollingUpdate"
        },
        "template": {
          "metadata": {
            "annotations": {
              "prometheus.io/port": "9898",
              "prometheus.io/scrape": "true"
            },
            "labels": {
              "app.kubernetes.io/name": "web-podinfo"
            }
          },
          "spec": {
            "containers": [
              {
                "command": [
                  "./podinfo",
                  "--port=9898",
                  "--cert-path=/data/cert",
                  "--port-metrics=9797",
                  "--grpc-port=9999",
                  "--grpc-service-name=podinfo",
                  "--cache-server=tcp://web-podinfo-redis:6379",
                  "--level=info",
                  "--random-delay=false",
                  "--random-error=false"
                ],
                "env": [
                  {
                    "name": "PODINFO_UI_COLOR",
                    "value": "#34577c"
                  }
                ],
                "image": "ghcr.io/stefanprodan/podinfo:6.11.0",
                "imagePullPolicy": "IfNotPresent",
                "livenessProbe": {
                  "exec": {
                    "command": [
                      "podcli",
                      "check",
                      "http",
                      "localhost:9898/healthz"
                    ]
                  },
                  "failureThreshold": 3,
                  "initialDelaySeconds": 1,
                  "periodSeconds": 10,
                  "successThreshold": 1,
                  "timeoutSeconds": 5
                },
                "name": "podinfo",
                "ports": [
                  {
                    "containerPort": 9898,
                    "name": "http",
                    "protocol": "TCP"
                  },
                  {
                    "containerPort": 9797,
                    "name": "http-metrics",
                    "protocol": "TCP"
                  },
                  {
                    "containerPort": 9999,
                    "name": "grpc",
                    "protocol": "TCP"
                  }
                ],
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "podcli",
                      "check",
                      "http",
                      "localhost:9898/readyz"
                    ]
                  },
                  "failureThreshold": 3,
                  "initialDelaySeconds": 1,
                  "periodSeconds": 10,
                  "successThreshold": 1,
                  "timeoutSeconds": 5
                },
                "resources": {
                  "requests": {
                    "cpu": "1m",
                    "memory": "16Mi"
                  }
                },
                "terminationMessagePath": "/dev/termination-log",
                "terminationMessagePolicy": "File",
                "volumeMounts": [
                  {
                    "mountPath": "/data",
                    "name": "data"
                  }
                ]
              }
            ],
            "dnsPolicy": "ClusterFirst",
            "restartPolicy": "Always",
            "schedulerName": "default-scheduler",
            "securityContext": {},
            "terminationGracePeriodSeconds": 30,
            "volumes": [
              {
                "emptyDir": {},
                "name": "data"
              }
            ]
          }
        }
      }
    }
  crons:
    refresh:
      action: refresh
      every: 120

deployment-web-podinfo-redis:
  # managed by helm:web
  defines: k8s/resource
  mode: observe
  eks_cluster: "import-demo"
  eks_region: "us-east-1"
  namespace: "shop"
  manifest: |
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "annotations": {
          "meta.helm.sh/release-name": "web",
          "meta.helm.sh/release-namespace": "shop"
        },
        "labels": {
          "app": "web-podinfo-redis",
          "app.kubernetes.io/managed-by": "Helm"
        },
        "name": "web-podinfo-redis",
        "namespace": "shop"
      },
      "spec": {
        "progressDeadlineSeconds": 600,
        "replicas": 1,
        "revisionHistoryLimit": 10,
        "selector": {
          "matchLabels": {
            "app": "web-podinfo-redis"
          }
        },
        "strategy": {
          "type": "Recreate"
        },
        "template": {
          "metadata": {
            "annotations": {
              "checksum/config": "3100599a951542fe012e1dffee3234ba6ebaaf77a6a4dbc221ba650ceef1bc1b"
            },
            "labels": {
              "app": "web-podinfo-redis"
            }
          },
          "spec": {
            "containers": [
              {
                "command": [
                  "redis-server",
                  "/redis-master/redis.conf"
                ],
                "image": "docker.io/redis:8.6.1",
                "imagePullPolicy": "IfNotPresent",
                "livenessProbe": {
                  "failureThreshold": 3,
                  "initialDelaySeconds": 5,
                  "periodSeconds": 10,
                  "successThreshold": 1,
                  "tcpSocket": {
                    "port": "redis"
                  },
                  "timeoutSeconds": 5
                },
                "name": "redis",
                "ports": [
                  {
                    "containerPort": 6379,
                    "name": "redis",
                    "protocol": "TCP"
                  }
                ],
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "redis-cli",
                      "ping"
                    ]
                  },
                  "failureThreshold": 3,
                  "initialDelaySeconds": 5,
                  "periodSeconds": 10,
                  "successThreshold": 1,
                  "timeoutSeconds": 5
                },
                "resources": {
                  "limits": {
                    "cpu": "1",
                    "memory": "128Mi"
                  },
                  "requests": {
                    "cpu": "100m",
                    "memory": "32Mi"
                  }
                },
                "terminationMessagePath": "/dev/termination-log",
                "terminationMessagePolicy": "File",
                "volumeMounts": [
                  {
                    "mountPath": "/var/lib/redis",
                    "name": "data"
                  },
                  {
                    "mountPath": "/redis-master",
                    "name": "config"
                  }
                ]
              }
            ],
            "dnsPolicy": "ClusterFirst",
            "restartPolicy": "Always",
            "schedulerName": "default-scheduler",
            "securityContext": {},
            "terminationGracePeriodSeconds": 30,
            "volumes": [
              {
                "emptyDir": {},
                "name": "data"
              },
              {
                "configMap": {
                  "defaultMode": 420,
                  "items": [
                    {
                      "key": "redis.conf",
                      "path": "redis.conf"
                    }
                  ],
                  "name": "web-podinfo-redis"
                },
                "name": "config"
              }
            ]
          }
        }
      }
    }
  crons:
    refresh:
      action: refresh
      every: 120

deployment-worker:
  defines: k8s/resource
  mode: observe
  eks_cluster: "import-demo"
  eks_region: "us-east-1"
  namespace: "shop"
  manifest: |
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "labels": {
          "app": "worker"
        },
        "name": "worker",
        "namespace": "shop"
      },
      "spec": {
        "progressDeadlineSeconds": 600,
        "replicas": 1,
        "revisionHistoryLimit": 10,
        "selector": {
          "matchLabels": {
            "app": "worker"
          }
        },
        "strategy": {
          "rollingUpdate": {
            "maxSurge": "25%",
            "maxUnavailable": "25%"
          },
          "type": "RollingUpdate"
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "worker"
            }
          },
          "spec": {
            "containers": [
              {
                "command": [
                  "sh",
                  "-c",
                  "while true; do echo working on $QUEUE; sleep 60; done"
                ],
                "envFrom": [
                  {
                    "configMapRef": {
                      "name": "worker-settings"
                    }
                  },
                  {
                    "secretRef": {
                      "name": "api-key"
                    }
                  }
                ],
                "image": "busybox:1.37",
                "imagePullPolicy": "IfNotPresent",
                "name": "worker",
                "resources": {},
                "terminationMessagePath": "/dev/termination-log",
                "terminationMessagePolicy": "File"
              }
            ],
            "dnsPolicy": "ClusterFirst",
            "restartPolicy": "Always",
            "schedulerName": "default-scheduler",
            "securityContext": {},
            "terminationGracePeriodSeconds": 30
          }
        }
      }
    }
  crons:
    refresh:
      action: refresh
      every: 120

secret-api-key:
  defines: k8s/resource
  mode: observe
  eks_cluster: "import-demo"
  eks_region: "us-east-1"
  namespace: "shop"
  manifest: |
    {
      "apiVersion": "v1",
      "kind": "Secret",
      "metadata": {
        "name": "api-key",
        "namespace": "shop"
      },
      "type": "Opaque"
    }
  crons:
    refresh:
      action: refresh
      every: 120

service-web-podinfo:
  # managed by helm:web
  defines: k8s/resource
  mode: observe
  eks_cluster: "import-demo"
  eks_region: "us-east-1"
  namespace: "shop"
  manifest: |
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "annotations": {
          "meta.helm.sh/release-name": "web",
          "meta.helm.sh/release-namespace": "shop"
        },
        "labels": {
          "app.kubernetes.io/managed-by": "Helm",
          "app.kubernetes.io/name": "web-podinfo",
          "app.kubernetes.io/version": "6.11.0",
          "helm.sh/chart": "podinfo-6.11.0"
        },
        "name": "web-podinfo",
        "namespace": "shop"
      },
      "spec": {
        "internalTrafficPolicy": "Cluster",
        "ipFamilies": [
          "IPv4"
        ],
        "ipFamilyPolicy": "SingleStack",
        "ports": [
          {
            "name": "http",
            "port": 9898,
            "protocol": "TCP",
            "targetPort": "http"
          },
          {
            "name": "grpc",
            "port": 9999,
            "protocol": "TCP",
            "targetPort": "grpc"
          }
        ],
        "selector": {
          "app.kubernetes.io/name": "web-podinfo"
        },
        "sessionAffinity": "None",
        "type": "ClusterIP"
      }
    }
  crons:
    refresh:
      action: refresh
      every: 120

service-web-podinfo-redis:
  # managed by helm:web
  defines: k8s/resource
  mode: observe
  eks_cluster: "import-demo"
  eks_region: "us-east-1"
  namespace: "shop"
  manifest: |
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "annotations": {
          "meta.helm.sh/release-name": "web",
          "meta.helm.sh/release-namespace": "shop"
        },
        "labels": {
          "app": "web-podinfo-redis",
          "app.kubernetes.io/managed-by": "Helm"
        },
        "name": "web-podinfo-redis",
        "namespace": "shop"
      },
      "spec": {
        "internalTrafficPolicy": "Cluster",
        "ipFamilies": [
          "IPv4"
        ],
        "ipFamilyPolicy": "SingleStack",
        "ports": [
          {
            "appProtocol": "redis",
            "name": "redis",
            "port": 6379,
            "protocol": "TCP",
            "targetPort": "redis"
          }
        ],
        "selector": {
          "app": "web-podinfo-redis"
        },
        "sessionAffinity": "None",
        "type": "ClusterIP"
      }
    }
  crons:
    refresh:
      action: refresh
      every: 120

release-web:
  defines: process-group
  runnable-list:
    - shop/configmap-web-podinfo-redis
    - shop/deployment-web-podinfo
    - shop/deployment-web-podinfo-redis
    - shop/service-web-podinfo
    - shop/service-web-podinfo-redis

stack:
  defines: process-group
  runnable-list:
    - shop/release-web
    - shop/configmap-worker-settings
    - shop/deployment-worker
    - shop/secret-api-key
