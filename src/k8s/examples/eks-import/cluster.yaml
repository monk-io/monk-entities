# EKS import demo, part 1: a small EKS cluster (two t3.medium nodes) from an
# empty AWS account, made with the Monk cluster's AWS credentials.
# Slimmed from src/aws-eks/example.yaml: no EBS, no app.
namespace: eks-import-demo

vpc:
  defines: aws-ec2/vpc
  region: us-east-1
  cidr_block: 10.30.0.0/16
  enable_dns_support: true
  enable_dns_hostnames: true
  tags:
    Name: import-demo
  services:
    data:
      protocol: custom

gateway:
  defines: aws-ec2/internet-gateway
  region: us-east-1
  vpc_id: <- connection-target("vpc") entity-state get-member("vpc_id")
  services:
    data:
      protocol: custom
  connections:
    vpc:
      runnable: eks-import-demo/vpc
      service: data
  depends:
    wait-for:
      runnables:
        - eks-import-demo/vpc
      timeout: 120

subnet-a:
  defines: aws-ec2/subnet
  region: us-east-1
  vpc_id: <- connection-target("vpc") entity-state get-member("vpc_id")
  cidr_block: 10.30.1.0/24
  availability_zone: us-east-1a
  map_public_ip_on_launch: true
  tags:
    kubernetes.io/role/elb: "1"   # where load balancers for Services go
  services:
    data:
      protocol: custom
  connections:
    vpc:
      runnable: eks-import-demo/vpc
      service: data
  depends:
    wait-for:
      runnables:
        - eks-import-demo/vpc
      timeout: 120

subnet-b:
  defines: aws-ec2/subnet
  region: us-east-1
  vpc_id: <- connection-target("vpc") entity-state get-member("vpc_id")
  cidr_block: 10.30.2.0/24
  availability_zone: us-east-1b
  map_public_ip_on_launch: true
  tags:
    kubernetes.io/role/elb: "1"
  services:
    data:
      protocol: custom
  connections:
    vpc:
      runnable: eks-import-demo/vpc
      service: data
  depends:
    wait-for:
      runnables:
        - eks-import-demo/vpc
      timeout: 120

routes:
  defines: aws-ec2/route-table
  region: us-east-1
  vpc_id: <- connection-target("vpc") entity-state get-member("vpc_id")
  routes:
    - destination_cidr_block: 0.0.0.0/0
      gateway_id: <- connection-target("gateway") entity-state get-member("internet_gateway_id")
  subnet_ids:
    - <- connection-target("subnet-a") entity-state get-member("subnet_id")
    - <- connection-target("subnet-b") entity-state get-member("subnet_id")
  services:
    data:
      protocol: custom
  connections:
    vpc:
      runnable: eks-import-demo/vpc
      service: data
    gateway:
      runnable: eks-import-demo/gateway
      service: data
    subnet-a:
      runnable: eks-import-demo/subnet-a
      service: data
    subnet-b:
      runnable: eks-import-demo/subnet-b
      service: data
  depends:
    wait-for:
      runnables:
        - eks-import-demo/gateway
        - eks-import-demo/subnet-a
        - eks-import-demo/subnet-b
      timeout: 120

cluster-role:
  defines: aws-iam/iam-role
  region: us-east-1
  role_name: import-demo-eks-cluster
  assume_role_policy_document:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: eks.amazonaws.com
        Action:
          - sts:AssumeRole
          - sts:TagSession
  attached_policies:
    - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
  services:
    data:
      protocol: custom

node-role:
  defines: aws-iam/iam-role
  region: us-east-1
  role_name: import-demo-eks-nodes
  assume_role_policy_document:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: ec2.amazonaws.com
        Action: sts:AssumeRole
  attached_policies:
    - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
    - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
    - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
  services:
    data:
      protocol: custom

eks:
  defines: aws-eks/cluster
  region: us-east-1
  name: import-demo
  version: "1.34"                 # quoted: YAML reads 1.30 as 1.3
  role_arn: <- connection-target("cluster-role") entity-state get-member("role_arn")
  subnet_ids:
    - <- connection-target("subnet-a") entity-state get-member("subnet_id")
    - <- connection-target("subnet-b") entity-state get-member("subnet_id")
  services:
    data:
      protocol: custom
  connections:
    cluster-role:
      runnable: eks-import-demo/cluster-role
      service: data
    subnet-a:
      runnable: eks-import-demo/subnet-a
      service: data
    subnet-b:
      runnable: eks-import-demo/subnet-b
      service: data
  depends:
    wait-for:
      runnables:
        - eks-import-demo/cluster-role
        - eks-import-demo/routes
      timeout: 120

nodes:
  defines: aws-eks/node-group
  region: us-east-1
  cluster_name: <- connection-target("eks") entity-state get-member("name")
  name: general
  node_role_arn: <- connection-target("node-role") entity-state get-member("role_arn")
  subnet_ids:
    - <- connection-target("subnet-a") entity-state get-member("subnet_id")
    - <- connection-target("subnet-b") entity-state get-member("subnet_id")
  instance_types: [t3.medium]
  desired_size: 2
  max_size: 2
  services:
    data:
      protocol: custom
  connections:
    eks:
      runnable: eks-import-demo/eks
      service: data
    node-role:
      runnable: eks-import-demo/node-role
      service: data
    subnet-a:
      runnable: eks-import-demo/subnet-a
      service: data
    subnet-b:
      runnable: eks-import-demo/subnet-b
      service: data
  depends:
    wait-for:
      runnables:
        - eks-import-demo/eks
        - eks-import-demo/node-role
      timeout: 1800

# Reached by name, with the Monk cluster's AWS credentials, which made the
# cluster and so are its admin.
k8s:
  defines: k8s/cluster
  eks_cluster: <- connection-target("eks") entity-state get-member("name")
  eks_region: <- connection-target("eks") entity-state get-member("region")
  services:
    data:
      protocol: custom
  connections:
    eks:
      runnable: eks-import-demo/eks
      service: data
  depends:
    wait-for:
      runnables:
        - eks-import-demo/nodes
      timeout: 1200

cluster:
  defines: group
  members:
    - eks-import-demo/vpc
    - eks-import-demo/gateway
    - eks-import-demo/subnet-a
    - eks-import-demo/subnet-b
    - eks-import-demo/routes
    - eks-import-demo/cluster-role
    - eks-import-demo/node-role
    - eks-import-demo/eks
    - eks-import-demo/nodes
    - eks-import-demo/k8s
