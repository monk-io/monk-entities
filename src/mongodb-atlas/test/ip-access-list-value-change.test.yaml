name: "MongoDB Atlas IP Access List — reconciles after a coincidental-adoption value change"
description: >
  Regression test: an entry that adopted a sibling's coincidentally-matching
  value (state.existing = true) at creation time must still reconcile to a
  new value once its own definition changes -- it must not be permanently
  frozen just because its initial value happened to already exist.
timeout: 300000

secrets:
  global:
    mongodb-atlas-token: "$MONGODB_ATLAS_TOKEN"

setup:
  - name: "Load compiled MongoDB Atlas entities"
    action: "load"
    target: "dist/input/mongodb-atlas/MANIFEST"
    expect:
      exitCode: 0

  - name: "Load initial template (two entries share one IP)"
    action: "load"
    target: "ip-access-list-value-change-template.yaml"
    expect:
      exitCode: 0

tests:
  - name: "Deploy the shared-value stack"
    action: "run"
    target: "mongodb-atlas-acl-valuechange-test/acl-valuechange-stack"
    expect:
      exitCode: 0

  - name: "Wait for entry A readiness"
    action: "wait"
    target: "mongodb-atlas-acl-valuechange-test/acl-entry-shared-a"
    waitFor:
      condition: "ready"
      timeout: 120000

  - name: "Wait for entry B readiness"
    action: "wait"
    target: "mongodb-atlas-acl-valuechange-test/acl-entry-shared-b"
    waitFor:
      condition: "ready"
      timeout: 120000

  - name: "Entry A reports the shared IP"
    action: "do"
    target: "mongodb-atlas-acl-valuechange-test/acl-entry-shared-a/get-info"
    expect:
      exitCode: 0
      contains:
        - "203.0.113.40"

  - name: "Entry B also reports the shared IP (adopted A's entry)"
    action: "do"
    target: "mongodb-atlas-acl-valuechange-test/acl-entry-shared-b/get-info"
    expect:
      exitCode: 0
      contains:
        - "203.0.113.40"

  - name: "List shows exactly the one shared entry, not two"
    action: "do"
    target: "mongodb-atlas-acl-valuechange-test/acl-entry-shared-a/list-entries"
    expect:
      exitCode: 0
      contains:
        - "203.0.113.40"

  # Reload with entry B's definition pointed at a NEW value -- simulates the
  # runnable it's derived from moving to a different peer with a different
  # public IP, the exact scenario from the reported bug.
  - name: "Load updated template (entry B now points at a different IP)"
    action: "load"
    target: "ip-access-list-value-change-template-v2.yaml"
    expect:
      exitCode: 0

  # Group members can't be updated individually in this framework, so
  # reconcile the whole group -- mirrors the existing update test in
  # ip-access-list-integration.test.yaml.
  - name: "Reconcile the stack with the new definition"
    action: "update"
    target: "mongodb-atlas-acl-valuechange-test/acl-valuechange-stack"
    expect:
      exitCode: 0

  - name: "Entry B now reports its new IP, not the stale shared one"
    action: "do"
    target: "mongodb-atlas-acl-valuechange-test/acl-entry-shared-b/get-info"
    expect:
      exitCode: 0
      contains:
        - "203.0.113.41"

  - name: "Atlas access list now contains the new IP"
    action: "do"
    target: "mongodb-atlas-acl-valuechange-test/acl-entry-shared-b/list-entries"
    expect:
      exitCode: 0
      contains:
        - "203.0.113.41"

  - name: "Entry A is unaffected and still reports the original shared IP"
    action: "do"
    target: "mongodb-atlas-acl-valuechange-test/acl-entry-shared-a/get-info"
    expect:
      exitCode: 0
      contains:
        - "203.0.113.40"

cleanup:
  - name: "Delete value-change stack"
    action: "delete"
    target: "mongodb-atlas-acl-valuechange-test/acl-valuechange-stack"
    expect:
      exitCode: 0
