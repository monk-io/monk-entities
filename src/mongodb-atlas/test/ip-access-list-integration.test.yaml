name: "MongoDB Atlas IP Access List Integration Test"
description: "Lifecycle + actions for the mongodb-atlas/ip-access-list-entry entity"
timeout: 300000

secrets:
  global:
    mongodb-atlas-token: "$MONGODB_ATLAS_TOKEN"

setup:
  - name: "Load compiled MongoDB Atlas entities"
    action: "load"
    target: "dist/input/mongodb-atlas/MANIFEST"
    expect:
      exitCode: 0

  - name: "Load IP access list test template"
    action: "load"
    target: "ip-access-list-template.yaml"
    expect:
      exitCode: 0

tests:
  - name: "Deploy access list stack"
    action: "run"
    target: "mongodb-atlas-acl-test/acl-stack"
    expect:
      exitCode: 0

  - name: "Wait for CIDR entry readiness"
    action: "wait"
    target: "mongodb-atlas-acl-test/acl-entry"
    waitFor:
      condition: "ready"
      timeout: 120000

  - name: "Wait for IP entry readiness"
    action: "wait"
    target: "mongodb-atlas-acl-test/acl-entry-ip"
    waitFor:
      condition: "ready"
      timeout: 120000

  - name: "get-info shows the CIDR entry"
    action: "do"
    target: "mongodb-atlas-acl-test/acl-entry/get-info"
    expect:
      exitCode: 0
      contains:
        - "192.0.2.0/24"

  - name: "get-info shows the IP entry"
    action: "do"
    target: "mongodb-atlas-acl-test/acl-entry-ip/get-info"
    expect:
      exitCode: 0
      contains:
        - "203.0.113.10"

  - name: "list-entries shows both entries"
    action: "do"
    target: "mongodb-atlas-acl-test/acl-entry/list-entries"
    expect:
      exitCode: 0
      contains:
        - "192.0.2.0/24"
        - "203.0.113.10"

  # update() has no single-entry PATCH — it deletes and recreates. Group members
  # can't be updated individually, so reconcile the whole group; the entry must
  # remain present afterward.
  - name: "Update (reconcile) the access list stack"
    action: "update"
    target: "mongodb-atlas-acl-test/acl-stack"
    expect:
      exitCode: 0

  - name: "CIDR entry still present after update"
    action: "do"
    target: "mongodb-atlas-acl-test/acl-entry/get-info"
    expect:
      exitCode: 0
      contains:
        - "192.0.2.0/24"

  # Comment change on an entry this stack created (PRO-885): update must apply the new
  # comment to the live Atlas entry, not only to the definition.
  - name: "get-info shows the original comment"
    action: "do"
    target: "mongodb-atlas-acl-test/acl-entry/get-info"
    expect:
      exitCode: 0
      contains:
        - "comment: monkec integration test"

  - name: "Load template with a changed comment"
    action: "load"
    target: "ip-access-list-template-updated.yaml"
    expect:
      exitCode: 0

  - name: "Update the stack with the changed comment"
    action: "update"
    target: "mongodb-atlas-acl-test/acl-stack"
    expect:
      exitCode: 0

  - name: "Wait for CIDR entry readiness after the comment change"
    action: "wait"
    target: "mongodb-atlas-acl-test/acl-entry"
    waitFor:
      condition: "ready"
      timeout: 120000

  - name: "get-info shows the updated comment from Atlas"
    action: "do"
    target: "mongodb-atlas-acl-test/acl-entry/get-info"
    expect:
      exitCode: 0
      contains:
        - "comment: monkec integration test (updated)"

  - name: "list-entries shows the updated comment"
    action: "do"
    target: "mongodb-atlas-acl-test/acl-entry/list-entries"
    expect:
      exitCode: 0
      contains:
        - "monkec integration test (updated)"

  # Negative case: an entry with two values set must fail validation before any API call.
  - name: "Reject entry with multiple values set"
    action: "run"
    target: "mongodb-atlas-acl-test/acl-entry-bad"
    expect:
      exitCode: 1
      contains:
        - "Only one of"

cleanup:
  - name: "Delete access list stack"
    action: "delete"
    target: "mongodb-atlas-acl-test/acl-stack"
    expect:
      exitCode: 0

  - name: "Delete invalid entry (best effort)"
    action: "delete"
    target: "mongodb-atlas-acl-test/acl-entry-bad"
    expect:
      exitCode: 0
