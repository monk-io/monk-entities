namespace: mongodb-atlas-acl-valuechange-test

# Project that owns the IP access list
acl-project:
  defines: mongodb-atlas/project
  name: monkec-acl-valuechange-test-project
  organization: Monk
  secret_ref: mongodb-atlas-token
  permitted-secrets:
    mongodb-atlas-token: true
  services:
    data:
      protocol: custom

# Two entries that initially resolve to the SAME value -- simulates two
# runnables on the same node coincidentally sharing one public IP. Whichever
# create() runs second finds the value already in Atlas's access list (created
# by its sibling) and adopts it (state.existing = true), even though it never
# truly pre-existed before this deployment.
acl-entry-shared-a:
  defines: mongodb-atlas/ip-access-list-entry
  project_id: <- connection-target("project") entity-state get-member("id")
  ip_address: 203.0.113.40
  comment: "monkec valuechange test - shared a"
  secret_ref: mongodb-atlas-token
  permitted-secrets:
    mongodb-atlas-token: true
  services:
    data:
      protocol: custom
  connections:
    project:
      runnable: mongodb-atlas-acl-valuechange-test/acl-project
      service: data
  depends:
    wait-for:
      runnables:
        - mongodb-atlas-acl-valuechange-test/acl-project
      timeout: 120

acl-entry-shared-b:
  defines: mongodb-atlas/ip-access-list-entry
  project_id: <- connection-target("project") entity-state get-member("id")
  ip_address: 203.0.113.40
  comment: "monkec valuechange test - shared b"
  secret_ref: mongodb-atlas-token
  permitted-secrets:
    mongodb-atlas-token: true
  services:
    data:
      protocol: custom
  connections:
    project:
      runnable: mongodb-atlas-acl-valuechange-test/acl-project
      service: data
  depends:
    wait-for:
      runnables:
        - mongodb-atlas-acl-valuechange-test/acl-project
      timeout: 120

acl-valuechange-stack:
  defines: group
  members:
    - mongodb-atlas-acl-valuechange-test/acl-project
    - mongodb-atlas-acl-valuechange-test/acl-entry-shared-a
    - mongodb-atlas-acl-valuechange-test/acl-entry-shared-b
