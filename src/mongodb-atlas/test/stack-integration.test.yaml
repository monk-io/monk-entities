name: "MongoDB Atlas Development Stack Test"
description: "Test development stack deployment with MongoDB Atlas entities"
timeout: 540000

secrets:
  global:
    mongodb-atlas-token: "$MONGODB_ATLAS_TOKEN"
    mongodb-dev-user-password: "dev-secure-password-456"

setup:
  - name: "Load compiled MongoDB Atlas entities"
    action: "load"
    target: "dist/input/mongodb-atlas/MANIFEST"
    expect:
      exitCode: 0

  - name: "Load stack template"
    action: "load"
    target: "stack-template.yaml"
    expect:
      exitCode: 0

tests:
  - name: "Deploy development stack"
    action: "run"
    target: "mongodb-test-stack/dev-stack"
    expect:
      exitCode: 0

  - name: "Wait for development stack readiness"
    action: "wait"
    target: "mongodb-test-stack/dev-stack"
    waitFor:
      condition: "ready"
      timeout: 240000

  - name: "Verify development project status"
    action: "describe"
    target: "mongodb-test-stack/dev-project"
    expect:
      exitCode: 0

  # === Cost estimation ===
  - name: "Test get-cost-estimate action"
    action: "do"
    target: "mongodb-test-stack/dev-cluster/get-cost-estimate"
    expect:
      exitCode: 0

  - name: "Test costs action"
    action: "do"
    target: "mongodb-test-stack/dev-cluster/costs"
    expect:
      exitCode: 0

  # The test cluster is M0, so both actions report the free tier.
  # get-actual-cost degrades gracefully without org-level billing access,
  # so it must still exit 0 whether or not the CI credentials can read invoices.
  - name: "Test get-actual-cost action"
    action: "do"
    target: "mongodb-test-stack/dev-cluster/get-actual-cost"
    expect:
      exitCode: 0

  # === Backup actions on M0 (ENG-838) ===
  # Read-only backup actions report "nothing here" with a note and succeed;
  # actions that would change backups fail with the tier message.
  - name: "list-snapshots on M0 reports the tier note"
    action: "do"
    target: "mongodb-test-stack/dev-cluster/list-snapshots"
    expect:
      exitCode: 0
      contains:
        - "Total snapshots available: 0"
        - "Backups require a dedicated cluster (M10 or higher)"

  - name: "list-restore-jobs on M0 reports the tier note"
    action: "do"
    target: "mongodb-test-stack/dev-cluster/list-restore-jobs"
    expect:
      exitCode: 0
      contains:
        - "Total restore jobs: 0"
        - "Backups require a dedicated cluster (M10 or higher)"

  - name: "create-snapshot on M0 fails with the tier message"
    action: "do"
    target: "mongodb-test-stack/dev-cluster/create-snapshot"
    expect:
      exitCode: 1
      contains:
        - "create-snapshot is not available on the M0 tier"

  - name: "Wait for connection test to exit"
    action: "wait"
    target: "mongodb-test-stack/dev-connection-test"
    waitFor:
      condition: "exited"
      timeout: 150000

  - name: "Check development connection test logs"
    action: "logs"
    target: "mongodb-test-stack/dev-connection-test"
    expect:
      exitCode: 0
      contains:
        - "Connected to MongoDB Atlas DEVELOPMENT successfully!"

  # === Existing cluster by name (ENG-836) ===
  # The test framework can't wipe one entity's state, so a second entity with the same
  # cluster name stands in for "state lost": it has no state.id, so create() runs and
  # must find the cluster instead of POSTing a duplicate. Its owner tag names
  # dev-cluster, so the twin adopts it as existing.
  - name: "Second entity for the same cluster name adopts it"
    action: "run"
    target: "mongodb-test-stack/dev-cluster-twin"
    expect:
      exitCode: 0

  - name: "Twin reaches readiness on the adopted cluster"
    action: "wait"
    target: "mongodb-test-stack/dev-cluster-twin"
    waitFor:
      condition: "ready"
      timeout: 120000

  - name: "Deleting the twin leaves the cluster in place"
    action: "delete"
    target: "mongodb-test-stack/dev-cluster-twin"
    expect:
      exitCode: 0

  - name: "Cluster still exists after the twin is deleted"
    action: "do"
    target: "mongodb-test-stack/dev-cluster/get-backup-info"
    expect:
      exitCode: 0
      contains:
        - "Cluster Tier: M0"

  - name: "Same name in another region is refused, not adopted"
    action: "run"
    target: "mongodb-test-stack/dev-cluster-mismatch"
    expect:
      exitCode: 1
      contains:
        - "does not match the definition"

  - name: "Verify all entities are running"
    action: "ps"
    expect:
      exitCode: 0

cleanup:
  # Twin and mismatch entities are never owners of the cluster, so deleting them
  # removes nothing in Atlas. Delete them first, then the stack that owns it.
  - name: "Delete cluster twin (best effort)"
    action: "delete"
    target: "mongodb-test-stack/dev-cluster-twin"
    expect:
      exitCode: 0

  - name: "Delete mismatched cluster entity (best effort)"
    action: "delete"
    target: "mongodb-test-stack/dev-cluster-mismatch"
    expect:
      exitCode: 0

  - name: "Delete development stack"
    action: "delete"
    target: "mongodb-test-stack/dev-stack"
    expect:
      exitCode: 0 