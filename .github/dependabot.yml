version: 2
updates:
  # Examples, Firebase samples and test fixtures are demo/sample code, not
  # shipped entities. A limit of 0 disables Dependabot (security) PRs for them.
  - package-ecosystem: npm
    directories:
      - "/examples/**/*"
      - "/firebase/**/*"
      - "/src/*/test/*"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
