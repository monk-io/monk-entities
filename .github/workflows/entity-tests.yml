name: Entity tests

# Type-checks every package and runs the offline tests of those that have
# them (src/<package>/test/*.test.ts), with fault exploration: nothing here
# reaches a real API or needs a Monk cluster. A pull request tests only the
# packages it changes, unless it changes what they all share (src/monkec,
# src/lib, the TypeScript and Deno config); pushes to main and
# manual runs test them all.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install monk (nightly)
        run: |
          mkdir -p "$RUNNER_TEMP/monk"
          curl -sSfL https://get.monk.io/nightly/linux/monk-amd64-latest.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/monk" monk
          echo "$RUNNER_TEMP/monk" >> "$GITHUB_PATH"
          echo "monk nightly $(curl -sSfL https://get.monk.io/nightly/linux/latest-version)"

      # monk entity is new; until a nightly has it, say so rather than fail
      # every pull request. (An unknown command prints help and exits 0, so
      # look for one of its flags.)
      - name: Check for monk entity
        id: monk
        run: |
          if monk entity test --help 2>&1 | grep -q -- '--explore'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::This monk nightly has no 'monk entity'; packages were not checked or tested."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Packages
        id: packages
        if: steps.monk.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          all=$(find src -mindepth 1 -maxdepth 1 -type d ! -name lib | sort | tr '\n' ' ')
          with_tests=""
          for d in $all; do
            if compgen -G "$d/test/*.test.ts" >/dev/null; then with_tests="$with_tests$d "; fi
          done

          tested="$with_tests"
          if [ -n "$PR" ]; then
            changed=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
            if grep -qE '^(src/(monkec|lib)/|src/tsconfig\.json$|deno\.(json|lock)$)' <<< "$changed"; then
              echo "This pull request changes what every package shares: testing them all."
            else
              tested=""
              for d in $with_tests; do
                if grep -q "^$d/" <<< "$changed"; then tested="$tested$d "; fi
              done
            fi
          fi
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "packages: $(wc -w <<< "$all"), with tests: ${with_tests:-none}"
          echo "testing: ${tested:-none}"

      - name: Type-check packages
        if: steps.monk.outputs.available == 'true'
        run: monk entity check ${{ steps.packages.outputs.all }}

      - name: Run tests and explore faults
        if: steps.monk.outputs.available == 'true' && steps.packages.outputs.tested != ''
        run: monk entity test -v --explore ${{ steps.packages.outputs.tested }}
