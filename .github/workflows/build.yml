name: Build and Commit Dist

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs: {}

# main takes changes only through reviewed pull requests, except from deploy
# keys. The dist environment holds this repository's one deploy key
# (secret DIST_DEPLOY_KEY) and only lets jobs on main use it, so this job
# can push the rebuilt dist straight to main and no branch can.
permissions:
  contents: read

concurrency:
  group: build-dist
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    environment: dist

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ssh-key: ${{ secrets.DIST_DEPLOY_KEY }}
        fetch-depth: 0

    - name: Install Podman
      run: |
        sudo apt-get update
        sudo apt-get install -y podman

    - name: Build modules
      run: |
        ./build.sh

    - name: Check for dist changes
      id: check-changes
      run: |
        echo "### Full git status before check ###"
        git status
        echo
        echo "### Porcelain status for dist/ ###"
        git status --porcelain dist/
        echo "------------------------------------"

        if [ -z "$(git status --porcelain dist/)" ]; then
          echo "Result: No changes detected in dist/."
          echo "no-changes=true" >> $GITHUB_OUTPUT
        else
          echo "Result: Changes detected in dist/."
          echo "no-changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push dist changes
      if: steps.check-changes.outputs.no-changes == 'false'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add dist/
        git commit -m "Build: Update dist files [skip ci]"
        git push origin HEAD:main
