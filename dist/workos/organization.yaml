namespace: workos
organization:
  defines: entity
  metadata:
    name: Organization
    description: |-
      WorkOS Organization entity.
      Creates and manages WorkOS organizations for B2B multi-tenant applications.
      Organizations are the top-level tenant grouping for SSO connections, directories, and users.

      ## Secrets
      - Reads: secret name from `secret_ref` property - WorkOS API key
      - Writes: none

      ## State Fields for Composition
      - `state.organization_id` - WorkOS organization ID (org_...)
      - `state.name` - Organization name

      ## Composing with Other Entities
      Works with:
      - `workos/credentials` - Shares API credentials
      - `workos/connection` - SSO connections belong to organizations
    version-hash: 1da4a36dc78f
  schema:
    secret_ref:
      type: string
      minLength: 1
      maxLength: 64
      description: Secret name storing WorkOS API key (sk_test_... or sk_production_...)
    name:
      type: string
      minLength: 1
      maxLength: 256
      description: Organization name
    organization_id:
      type: string
      description: 'Optional: adopt existing organization by ID'
    domains:
      type: array
      items:
        type: string
      description: Verified domains for the organization
    metadata:
      type: object
      additionalProperties:
        description: Organization metadata key-value pairs
      description: Organization metadata key-value pairs
    required:
      - secret_ref
      - name
  state-schema:
    existing:
      type: boolean
      description: Indicates if the resource already existed before this entity managed it
    organization_id:
      type: string
      description: WorkOS organization ID (org_...)
    name:
      type: string
      description: Organization name
  lifecycle:
    sync: <<< organization-sync.js
    get-info: ''
    get-cost-estimate: ''
    costs: ''
  checks:
    readiness:
      period: 10
      initialDelay: 1
      attempts: 12
  requires:
    - workos/workos-base
    - cli
