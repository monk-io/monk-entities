namespace: gcp
iap-tunnel-dest-group:
  defines: entity
  metadata:
    name: IapTunnelDestGroup
    description: |-
      GCP IAP Tunnel Destination Group entity. Manages named groups of IP blocks and
      FQDNs that can be used as scope for IAP TCP forwarding IAM bindings. A single group is scoped
      to a project+location.

      ## Required Permissions
      - `iap.tunnelDestGroups.create`
      - `iap.tunnelDestGroups.get`
      - `iap.tunnelDestGroups.list`
      - `iap.tunnelDestGroups.update`
      - `iap.tunnelDestGroups.delete`

      ## Secrets
      - Reads: none (authenticated via GCP provider)
      - Writes: none

      ## State Fields for Composition
      - `state.group_name` — full resource name

      ## Composing with Other Entities
      Works with:
      - `gcp/iap-access-policy` — grant `roles/iap.tunnelResourceAccessor` on a tunnel resource
    version-hash: 318bcf1d649c
  schema:
    project:
      type: string
      description: 'Override the GCP project ID (optional, defaults to environment)'
    force_ownership:
      type: boolean
      description: |-
        When true, classify the resource as owned by this entity
        even if `create()` finds it pre-existing in the cloud (the usual
        adopt branch). Subsequent `delete()` will remove it.

        Use this when you know the resource was created by a previous run of
        your stack — e.g. after a Monk cluster reset wiped the ledger. Without
        this flag, the entity adopts (sets `existing=true`) and `delete()`
        refuses to clean up on teardown, leaving residue in the cloud.

        Leave unset/false when the resource is genuinely externally-managed
        and you just want to read/reconcile it.
    name:
      type: string
      description: 'Group identifier — lowercase letters, digits, and dashes only; unique per project+location'
    location:
      type: string
      description: 'GCP region (e.g., "us-central1")'
    cidrs:
      type: array
      items:
        type: string
      description: List of CIDR blocks belonging to this destination group
    fqdns:
      type: array
      items:
        type: string
      description: List of fully-qualified domain names belonging to this destination group
    required:
      - name
      - location
  state-schema:
    existing:
      type: boolean
      description: Indicates if the resource already existed before this entity managed it
    operation_name:
      type: string
      description: Operation name for tracking long-running operations
    group_name:
      type: string
      description: 'Full resource name (projects/{project}/iap_tunnel/locations/{location}/destGroups/{name})'
  lifecycle:
    sync: <<< iap-tunnel-dest-group-sync.js
    get-info: ''
    list-cidrs: ''
  checks:
    readiness:
      period: 5
      initialDelay: 1
      attempts: 6
    liveness:
      period: 300
  requires:
    - monkec/base
    - gcp/gcp-base
    - cli
    - gcp/iap-common
