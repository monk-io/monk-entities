namespace: gcp
iap-oauth-client:
  defines: entity
  metadata:
    name: IapOauthClient
    description: |-
      GCP IAP OAuth Client entity. Creates and manages OAuth 2.0 clients under an IAP
      OAuth brand. On create, the returned client secret is written to a Monk secret so downstream
      entities (iap-settings) can consume it. On adoption of an existing client, the secret is rotated
      (GCP does not return secrets on GET) so the Monk secret always holds a valid value.

      ## Required Permissions
      - `clientauthconfig.clients.create`
      - `clientauthconfig.clients.get`
      - `clientauthconfig.clients.list`
      - `clientauthconfig.clients.update` (resetSecret)
      - `clientauthconfig.clients.delete`

      ## Secrets
      - Reads: none (authenticated via GCP provider)
      - Writes: OAuth client secret written to `definition.secret_ref`. Add `permitted-secrets`:
        ```yaml
        permitted-secrets:
          <secret_ref>: true
        ```

      ## State Fields for Composition
      - `state.client_id` — OAuth client ID, consumed by iap-settings `oauth_settings.client_id`
      - `state.client_name` — full resource name

      ## Composing with Other Entities
      Works with:
      - `gcp/iap-brand` — provides brand_id
      - `gcp/iap-settings` — consumes client_id + secret value to configure IAP on a resource
    version-hash: 49eb08d04ae2
  schema:
    project:
      type: string
      description: 'Override the GCP project ID (optional, defaults to environment)'
    force_ownership:
      type: boolean
      description: |-
        When true, classify the resource as owned by this entity
        even if `create()` finds it pre-existing in the cloud (the usual
        adopt branch). Subsequent `delete()` will remove it.

        Use this when you know the resource was created by a previous run of
        your stack — e.g. after a Monk cluster reset wiped the ledger. Without
        this flag, the entity adopts (sets `existing=true`) and `delete()`
        refuses to clean up on teardown, leaving residue in the cloud.

        Leave unset/false when the resource is genuinely externally-managed
        and you just want to read/reconcile it.
    brand_id:
      type: string
      description: |-
        Brand ID (trailing segment of a brand resource name).
        Usually obtained from `connection-target("brand") entity-state get-member("brand_id")`.
    display_name:
      type: string
      description: |-
        Human-readable display name for the OAuth client. Used to
        match an existing client on re-runs (displayName is the only searchable field).
    secret_ref:
      type: string
      description: |-
        Monk secret name where the generated OAuth client secret will be written.
        Must be listed under `permitted-secrets` in the template.
    required:
      - brand_id
      - display_name
      - secret_ref
  state-schema:
    existing:
      type: boolean
      description: Indicates if the resource already existed before this entity managed it
    operation_name:
      type: string
      description: Operation name for tracking long-running operations
    client_name:
      type: string
      description: 'Full resource name (projects/{pn}/brands/{brand}/identityAwareProxyClients/{id})'
    client_id:
      type: string
      description: OAuth client ID (trailing segment of the resource name)
  lifecycle:
    sync: <<< iap-oauth-client-sync.js
    get-info: ''
    reset-secret: ''
    get-secret: ''
  checks:
    readiness:
      period: 5
      initialDelay: 1
      attempts: 6
    liveness:
      period: 300
  requires:
    - monkec/base
    - gcp/gcp-base
    - secret
    - cli
    - gcp/iap-common
