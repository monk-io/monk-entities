namespace: gcp
cloud-run-job:
  defines: entity
  metadata:
    name: CloudRunJob
    description: |-
      Creates and manages batch container workloads on Google Cloud Run Jobs.
      Supports task parallelism, retries, execution overrides, and cost estimation.

      ## Required Permissions
      - `run.jobs.create` — create jobs
      - `run.jobs.get` — check job status
      - `run.jobs.update` — update jobs
      - `run.jobs.delete` — delete jobs
      - `run.jobs.run` — execute jobs
      - `run.executions.get` — check execution status
      - `run.executions.list` — list executions
      - `run.operations.get` — poll long-running operations
      - `monitoring.timeSeries.list` — cost estimation metrics

      ## Secrets
      - Reads: none (authenticated via gcp provider)
      - Writes: none

      ## State Fields for Composition
      - `state.name` - Job name
      - `state.execution_count` - Number of executions
      - `state.latest_execution` - Latest execution reference

      ## Composing with Other Entities
      Works with:
      - `gcp/service-usage` — enable run.googleapis.com API
      - `gcp/service-account` — custom service account for the job
    version-hash: 182d3d78c5f6
  schema:
    project:
      type: string
      description: 'Override the GCP project ID (optional, defaults to environment)'
    name:
      type: string
      description: |-
        Job name (must be unique within project/region).
        1-49 characters, lowercase letters, numbers, and hyphens.
    location:
      type: string
      enum:
        - africa-south1
        - asia-east1
        - asia-east2
        - asia-northeast1
        - asia-northeast2
        - asia-northeast3
        - asia-south1
        - asia-south2
        - asia-southeast1
        - asia-southeast2
        - australia-southeast1
        - australia-southeast2
        - europe-central2
        - europe-north1
        - europe-southwest1
        - europe-west1
        - europe-west2
        - europe-west3
        - europe-west4
        - europe-west6
        - europe-west8
        - europe-west9
        - europe-west10
        - europe-west12
        - me-central1
        - me-central2
        - me-west1
        - northamerica-northeast1
        - northamerica-northeast2
        - northamerica-south1
        - us-central1
        - us-south1
        - us-east1
        - us-east4
        - us-east5
        - us-west1
        - us-west2
        - us-west3
        - us-west4
        - southamerica-east1
        - southamerica-west1
      description: GCP region for the job
    image:
      type: string
      description: 'Container image URI (e.g., gcr.io/project/image:tag)'
    command:
      type: array
      items:
        type: string
      description: Container entrypoint command override
    container_args:
      type: array
      items:
        type: string
      description: Container command arguments
    env_vars:
      type: object
      additionalProperties:
        type: string
        description: Environment variables as key-value pairs
      description: Environment variables as key-value pairs
    cpu:
      type: string
      description: 'CPU limit (e.g., "1", "2", "4")'
      default: '1'
    memory:
      type: string
      description: 'Memory limit (e.g., "512Mi", "1Gi", "2Gi")'
      default: 512Mi
    timeout_seconds:
      type: number
      description: Task timeout in seconds
      default: 600
    max_retries:
      type: number
      description: Maximum number of retries per failed task
      default: 3
    task_count:
      type: number
      description: Number of tasks to run
      default: 1
    parallelism:
      type: number
      description: Maximum number of tasks to run in parallel
      default: 0
    service_account:
      type: string
      description: IAM service account email for the job
    execution_environment:
      type: string
      enum:
        - EXECUTION_ENVIRONMENT_GEN1
        - EXECUTION_ENVIRONMENT_GEN2
      description: Execution environment generation
    labels:
      type: object
      additionalProperties:
        type: string
        description: Resource labels as key-value pairs
      description: Resource labels as key-value pairs
    required:
      - name
      - location
      - image
  state-schema:
    existing:
      type: boolean
      description: Indicates if the resource already existed before this entity managed it
    operation_name:
      type: string
      description: Operation name for tracking long-running operations
    name:
      type: string
      description: Job name
    execution_count:
      type: number
      description: Number of executions run
    latest_execution:
      type: string
      description: Latest execution name
    reconciling:
      type: boolean
      description: Whether the job is currently reconciling
  lifecycle:
    sync: <<< cloud-run-job-sync.js
    get-info: ''
    execute: ''
    get-executions: ''
    get-cost-estimate: ''
    costs: ''
  checks:
    readiness:
      period: 10
      initialDelay: 5
      attempts: 30
    liveness:
      period: 300
  requires:
    - monkec/base
    - gcp/gcp-base
    - cli
    - gcp/common
