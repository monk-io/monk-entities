namespace: gcp
project-iam-binding:
  defines: entity
  metadata:
    name: ProjectIamBinding
    description: |-
      Manages a single project-level IAM binding (role + member).
      Decoupled from the entity that owns the identity, so you can grant roles
      to any principal type and clean up individual grants without touching the
      identity itself.
    version-hash: 318bcf1d649c
  schema:
    project:
      type: string
      description: 'Override the GCP project ID (optional, defaults to environment)'
    force_ownership:
      type: boolean
      description: |-
        When true, classify the resource as owned by this entity
        even if `create()` finds it pre-existing in the cloud (the usual
        adopt branch). Subsequent `delete()` will remove it.

        Use this when you know the resource was created by a previous run of
        your stack — e.g. after a Monk cluster reset wiped the ledger. Without
        this flag, the entity adopts (sets `existing=true`) and `delete()`
        refuses to clean up on teardown, leaving residue in the cloud.

        Leave unset/false when the resource is genuinely externally-managed
        and you just want to read/reconcile it.
    role:
      type: string
      description: |-
        IAM role to grant. Predefined
        (e.g. `roles/bigquery.dataViewer`) or custom
        (`projects/<project>/roles/<id>`).
    member:
      type: string
      description: |-
        Principal receiving the role. Must include the IAM prefix:
        `user:alice@example.com`
        `group:engineers@example.com`
        `serviceAccount:foo@project.iam.gserviceaccount.com`
        `domain:example.com`
        `allAuthenticatedUsers` / `allUsers` (no prefix — special)
    binding_condition:
      type: object
      properties:
        title:
          type: string
          description: Short title for the condition (shown in Cloud Console)
        condition_description:
          type: string
          description: Optional longer description
        expression:
          type: string
          description: |-
            CEL expression evaluated on each request. Examples:
            `request.time < timestamp("2026-12-31T00:00:00Z")`
            `resource.name.startsWith("projects/_/buckets/public-")`
      required:
        - title
        - expression
      additionalProperties: false
      description: |-
        Optional IAM Condition (CEL-gated access). Two bindings
        for the same (role, member) but different conditions are distinct.
    required:
      - role
      - member
  state-schema:
    existing:
      type: boolean
      description: |-
        True iff the binding for (role, member) was already
        present when this entity first ran `create()` — i.e. we adopted it.
        False iff this entity instance actually appended the member.
        `delete()` keys off this: we never remove a grant we didn't add.

        Sticky: once set on the first create, subsequent updates never flip
        it, so a mid-deploy retry that finds its own just-added member can't
        mistakenly re-classify the binding as adopted.
    operation_name:
      type: string
      description: Operation name for tracking long-running operations
    project:
      type: string
      description: Resolved project ID this binding targets
    role:
      type: string
      description: Role granted
    member:
      type: string
      description: Principal the role was granted to
    last_etag:
      type: string
      description: |-
        Etag observed on the most recent successful write.
        Informational only; each call re-reads before writing.
  lifecycle:
    sync: <<< project-iam-binding-sync.js
    get-info: ''
  checks:
    readiness:
      period: 5
      initialDelay: 2
      attempts: 10
    liveness:
      period: 300
  requires:
    - monkec/base
    - gcp/gcp-base
    - cli
    - gcp/common
