namespace: resend
resend-api-key:
  defines: entity
  metadata:
    name: ResendApiKey
    description: |-
      Resend API Key entity.
      Creates a scoped API key on Resend and writes the returned token to a
      Monk secret. Adopts existing keys by name (token NOT re-fetched —
      Resend only returns it on create). Delete revokes the key.

      ## Secrets
      - Reads: `secret_ref` (defaults to `resend-api-token`) — Full Access needed
        to create scoped keys.
      - Writes: `token_secret_ref` (defaults to `resend-api-key-{name}`).

      ## Actions
      - `list-keys` — list all keys on the account
    version-hash: b991eef2ce2c
  schema:
    secret_ref:
      type: string
      description: Optional secret reference for the Resend API key; defaults to `resend-api-token`
    name:
      type: string
      description: Human-readable key name (≤50 chars)
    permission:
      type: string
      enum:
        - full_access
        - sending_access
      description: Permission scope; default "sending_access"
    domain_id:
      type: string
      description: |-
        Restrict to a specific domain by id. Only valid with
        `permission: "sending_access"`.
    token_secret_ref:
      type: string
      description: |-
        Monk secret name to write the key value to. Required —
        the API key has no purpose if not stored. Default: `resend-api-key-{name}`.
    required:
      - name
  state-schema:
    existing:
      type: boolean
      description: Resource existed before this entity created it
    id:
      type: string
      description: Resend API key id
    name:
      type: string
      description: Key name mirror
    token_secret_ref:
      type: string
      description: Where the key token was written
    created_at:
      type: string
      description: Created-at timestamp
  lifecycle:
    sync: <<< resend-api-key-sync.js
    list-keys: ''
  checks:
    readiness:
      period: 5
      initialDelay: 1
      attempts: 6
  requires:
    - monkec/base
    - cli
    - secret
    - resend/resend-base
