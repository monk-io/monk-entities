namespace: clerk
jwt-template:
  defines: entity
  metadata:
    name: JwtTemplate
    description: |-
      Clerk JWT Template entity.
      Creates and manages JWT templates for generating custom tokens.
      JWT templates define the claims, lifetime, and signing configuration for tokens.

      ## Secrets
      - Reads: secret name from `secret_ref` property - Clerk secret API key
      - Writes: none

      ## State Fields for Composition
      - `state.template_id` - JWT template ID
      - `state.name` - Template name

      ## Composing with Other Entities
      Works with:
      - `clerk/credentials` - Shares API credentials
    version-hash: 80c62971cc9f
  schema:
    secret_ref:
      type: string
      minLength: 1
      maxLength: 64
      description: Secret name storing Clerk secret API key (sk_test_... or sk_live_...)
    name:
      type: string
      minLength: 1
      maxLength: 256
      description: Template name (unique identifier)
    template_id:
      type: string
      description: 'Optional: adopt existing template by ID'
    claims:
      type: object
      additionalProperties:
        description: Custom claims as a JSON object (required by Clerk API)
      description: Custom claims as a JSON object (required by Clerk API)
    lifetime:
      type: number
      description: Token lifetime in seconds
    clock_skew_in_seconds:
      type: number
      description: Clock skew tolerance in seconds
    signing_algorithm:
      type: string
      description: 'Custom signing algorithm (e.g., RS256, HS256)'
    allowed_clock_skew:
      type: number
      description: Allowed clock skew in seconds
    required:
      - secret_ref
      - name
      - claims
  state-schema:
    existing:
      type: boolean
      description: Indicates if the resource already existed before this entity managed it
    template_id:
      type: string
      description: JWT template ID
    name:
      type: string
      description: Template name
  lifecycle:
    sync: <<< jwt-template-sync.js
    get-info: ''
  checks:
    readiness:
      period: 10
      initialDelay: 1
      attempts: 12
  requires:
    - clerk/clerk-base
    - cli
