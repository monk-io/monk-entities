namespace: aws-route53
hosted-zone:
  defines: entity
  metadata:
    name: HostedZone
    description: |-
      AWS Route 53 Hosted Zone entity.
      Creates and manages DNS hosted zones (public and private) with tagging support.
      Supports split-view DNS (same domain, public + private zones) and automatic
      cleanup of non-default records before zone deletion.

      ## Required Permissions
      - `route53:CreateHostedZone` — create new hosted zones
      - `route53:GetHostedZone` — read zone details and name servers
      - `route53:ListHostedZonesByName` — find existing zones for adoption
      - `route53:UpdateHostedZoneComment` — update zone comments
      - `route53:DeleteHostedZone` — delete hosted zones
      - `route53:ListResourceRecordSets` — list records (for cleanup and list-records action)
      - `route53:ChangeResourceRecordSets` — delete non-default records before zone removal
      - `route53:GetChange` — poll change propagation status
      - `route53:ChangeTagsForResource` — manage zone tags
      - `cloudwatch:GetMetricStatistics` — DNS query metrics for cost estimation

      ## Secrets
      - Reads: none (authenticated via AWS provider)
      - Writes: none

      ## State Fields for Composition
      - `state.zone_id` - Hosted zone ID (e.g., Z0308686QVIR0FTS2ODJ), used by `aws-route53/record`
      - `state.zone_name` - FQDN with trailing dot (e.g., example.com.)
      - `state.name_servers` - Array of assigned NS records
      - `state.record_set_count` - Number of records in the zone

      ## Composing with Other Entities
      Works with:
      - `aws-route53/record` - DNS records within this zone (wire zone_id via connection-target)
      - `aws-route53/health-check` - Health checks referenced by failover records
    version-hash: d7df84da8f83
  schema:
    region:
      type: string
      description: AWS region (used for signing; Route 53 is a global service)
    zone_name:
      type: string
      description: 'Domain name for the hosted zone (e.g., example.com)'
    is_private:
      type: boolean
      description: Whether this is a private hosted zone
    vpc_id:
      type: string
      description: VPC ID for private hosted zones
    vpc_region:
      type: string
      description: VPC region for private hosted zones (defaults to entity region)
    zone_comment:
      type: string
      description: Comment for the hosted zone
    tags:
      type: object
      additionalProperties:
        type: string
        description: Resource tags
      description: Resource tags
    required:
      - region
      - zone_name
  state-schema:
    existing:
      type: boolean
      description: Indicates if the resource pre-existed before this entity managed it
    zone_id:
      type: string
      description: Route 53 hosted zone ID (without /hostedzone/ prefix)
    zone_name:
      type: string
      description: Fully qualified zone name
    name_servers:
      type: array
      items:
        type: string
      description: Assigned name servers
    record_set_count:
      type: number
      description: Number of record sets in the zone
    required:
      - existing
  lifecycle:
    sync: <<< hosted-zone-sync.js
    get-zone-info: ''
    list-records: ''
    get-cost-estimate: ''
    costs: ''
  checks:
    readiness:
      period: 10
      initialDelay: 2
      attempts: 12
    liveness:
      period: 300
  requires:
    - monkec/base
    - aws-route53/route53-base
    - cli
    - aws-route53/common
